<title>Jingle Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mountains+of+Christmas:wght@700&display=swap">
<style>
:root{
  --night:#0a1230;--deep:#12205a;--card:#182b6c;--card2:#1f3686;--line:#3b5cc0;--snow:#f5f9ff;--ice:#a9d6f5;
  --red:#e8443b;--pine:#2f9e63;--gold:#ffcf5a;--pink:#ffb3d0;--ink:#0a1230;--mute:#b7c6ee;
  --might:#ff7a59;--sparkle:#7fb5ff;--sneak:#b48cff;--kind:#ff9ccf;
  --r0:#b9c4e6;--r1:#5cc8ff;--r2:#c58bff;--r3:#ffcf5a;
  --f-display:'Mountains of Christmas',Georgia,serif;--f-body:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
body{margin:0;background:var(--night);background-image:radial-gradient(120% 60% at 50% 0%,#233a86 0%,rgba(10,18,48,0) 70%);background-repeat:no-repeat;background-attachment:fixed;color:var(--snow);font-family:var(--f-body);font-size:17px;line-height:1.42;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body[data-screen=title],body[data-screen=create]{padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--deep)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h2.st{font-size:32px;margin:0 0 10px}h3{font-size:23px;margin:18px 0 8px}
p{margin:0 0 .8em;max-width:65ch}small{font-size:13px;color:var(--mute)}
.center{text-align:center}.center p{margin-inline:auto}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.grow{flex:1}
u{text-decoration:none;opacity:.3}

/* hud */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-inline:-16px}
.hud-in{background:var(--deep);padding:8px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.hrow,.hrow2{display:flex;align-items:center;gap:8px;min-width:0}
.hrow2{margin:6px 0 4px;gap:10px}
.hav{font-size:22px}.hname{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{font-size:13px;font-weight:800;background:var(--gold);color:var(--ink);border-radius:999px;padding:0 9px;white-space:nowrap}
.ngtag{font-size:12px;font-weight:800;background:#7fd0ff;color:var(--ink);border-radius:999px;padding:0 8px}
.pill{font-size:14px;font-weight:700;background:#24408f;border-radius:999px;padding:0 9px;white-space:nowrap}
.ibtn{background:#24408f;border:2px solid var(--line);border-radius:12px;min-width:38px;min-height:38px;font-weight:800}
.ibtn:hover{background:#2c4ba8}
.sstars{font-size:15px;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.xpbar{height:4px;background:#0b1544;border-radius:3px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7fd0ff,#c58bff);transition:width .5s}
.cane{height:7px;background:repeating-linear-gradient(135deg,var(--red) 0 10px,#fff 10px 20px)}

/* meters */
.meter{position:relative;flex:1;height:22px;background:#0b1544;border:2px solid #2a4399;border-radius:999px;overflow:hidden;min-width:0}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .45s}
.meter span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:18px;text-shadow:0 1px 2px #000a}
.meter.cheer i{background:linear-gradient(90deg,#ff5f6d,#ff9a8b)}
.meter.grump i{background:linear-gradient(90deg,#8a2fe0,#d04ab0)}
.meter.jolly i{background:linear-gradient(90deg,#2f9e63,#ffcf5a,#e8443b)}
.meter.jolly.ready{animation:glow 1s infinite alternate;border-color:var(--gold)}
.meter.xp i{background:linear-gradient(90deg,#7fd0ff,#c58bff)}
@keyframes glow{from{box-shadow:0 0 0 #ffcf5a00}to{box-shadow:0 0 14px #ffcf5acc}}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;margin:14px 0;box-shadow:0 10px 30px #0006}
.card .body{padding:16px 16px 18px}
.art{position:relative;height:150px;background:#0b1544;overflow:hidden}
.art svg,.stage-art svg{display:block;width:100%;height:100%}
.art.bossart::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px #a000c0aa;pointer-events:none}
.narr{font-size:18px}
.say{display:flex;gap:10px;margin:0 0 10px;align-items:flex-start}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card2);border:2px solid var(--line);display:grid;place-items:center;font-size:24px}
.bub{background:var(--card2);border-radius:4px 16px 16px 16px;padding:7px 12px;flex:1;min-width:0}
.bub b{display:block;font-size:13px;color:var(--gold);line-height:1.2}.bub p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{font-size:13px;font-weight:800;border-radius:999px;padding:1px 10px;background:#24408f}
.chip.good{background:#1f7a4d}.chip.bad{background:#a83232}.chip.gold{background:var(--gold);color:var(--ink)}.chip.info{background:#35519f}
.tag{font-size:12px;font-weight:800;border-radius:8px;padding:1px 8px;white-space:nowrap;background:#35519f;color:#fff}
.tag.might{background:var(--might);color:var(--ink)}.tag.sparkle{background:var(--sparkle);color:var(--ink)}.tag.sneak{background:var(--sneak);color:var(--ink)}.tag.kind{background:var(--kind);color:var(--ink)}
.tag.mini{background:var(--pine)}.tag.opt{background:#2a4399}
.note{font-size:15px;color:var(--mute);margin:8px 0}.note.gold{color:var(--gold);font-weight:700}
.rule{font-size:16px}.odd{font-weight:800;border-radius:8px;padding:0 8px}
.odd.easy{background:#1f7a4d}.odd.fair{background:#9a7a10}.odd.tricky{background:#b5611c}.odd.hard{background:#a83232}

/* buttons */
.btn{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:8px 16px;min-height:44px;font-weight:700;transition:transform .08s,background .15s}
.btn:hover:not(:disabled){background:#2c4ba8}.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.45}
.btn.primary{background:linear-gradient(#f0584e,#c8332b);border-color:#ff9a8f;box-shadow:0 4px 0 #8a1f1a}
.btn.primary:hover:not(:disabled){background:linear-gradient(#ff6a60,#d43a32)}
.btn.gold{background:linear-gradient(#ffd75e,#e5a417);color:var(--ink);border-color:#fff0a8}
.btn.big{min-height:54px;font-size:19px}.btn.sm{min-height:36px;padding:3px 12px;font-size:15px;border-radius:11px}
.btn.ghost{background:transparent}
.btn.pulse{animation:pulse .9s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.btn small{display:block;font-size:12px;opacity:.85;color:inherit}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row2,.row3{display:grid;gap:8px;margin-top:8px}.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1.3fr}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:50px;font-weight:700;font-size:17px;transition:transform .08s,background .15s}
.ch:hover:not(:disabled){background:#2c4ba8;transform:translateX(3px)}
.ch.go{background:linear-gradient(#2f9e63,#1f7a4d);border-color:#7be0a8;justify-content:center;text-align:center;font-size:19px}
.ch.alt{background:transparent;border-style:dashed}
.ch small{display:block}
.toggle{width:100%;text-align:left;background:#24408f;border:2px solid var(--line);border-radius:12px;padding:8px 14px;min-height:44px;font-weight:700;margin:6px 0}
.toggle[aria-pressed=true]{background:#1f7a4d;border-color:#7be0a8}
.die{width:90px;height:90px;border-radius:20px;background:#fff;color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:48px;margin:14px auto;box-shadow:0 6px 0 #aab6dd}
.die.rolling{animation:tumble .3s infinite}.die.win{background:#c5ffd9;box-shadow:0 6px 0 #4aa874}.die.lose{background:#ffd0d0;box-shadow:0 6px 0 #c96b6b}
@keyframes tumble{0%{transform:rotate(-8deg)}50%{transform:rotate(10deg) translateY(-6px)}100%{transform:rotate(-8deg)}}
.math{text-align:center;font-weight:800;color:var(--mute);margin-bottom:8px}
.foeprev{display:flex;gap:12px;align-items:center;background:#0f1d52;border-radius:16px;padding:10px 12px;margin-top:12px}
.foeprev.boss{border:2px solid #c050e0}
.fi{font-size:46px;line-height:1}.foeprev small{display:block}.wk{color:var(--gold)}
.lvtag{font-size:12px;font-weight:800;background:#35519f;border-radius:6px;padding:0 6px;margin-left:4px}
.bosstag{font-size:12px;font-weight:800;background:#a000c0;border-radius:6px;padding:0 6px;margin-left:4px}

/* title */
.title{text-align:center;padding-top:8px}
.title-art{margin:0 -16px;height:260px;overflow:hidden;border-radius:0 0 28px 28px}.title-art svg{width:100%;height:100%;display:block}
.logo{font-size:64px;display:flex;flex-direction:column;line-height:.9;margin-top:-14px;position:relative;text-shadow:0 4px 0 #8a1f1a,0 0 30px #ffcf5a88}
.logo span:first-child{color:#ffefa0}.logo span:last-child{color:var(--snow)}
.tagline{font-family:var(--f-display);font-size:26px;color:var(--gold);margin:10px 0 2px}
.sub{color:var(--mute);margin-inline:auto}
.title .stack{max-width:360px;margin-inline:auto}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cls{background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.cls[aria-pressed=true]{border-color:var(--gold);background:#2a46a0;box-shadow:0 0 0 3px #ffcf5a55}
.cls .ic{font-size:34px}.cls b{font-size:16px;line-height:1.1}.cls .abn{margin-top:4px}
.pips{display:flex;align-items:center;gap:2px}.pips .n{width:52px;font-size:11px;color:var(--mute);font-weight:700}
.pips i{width:8px;height:8px;border-radius:2px;background:#0b1544}.pips i.on{background:var(--gold)}
input[type=text]{width:100%;font:inherit;font-size:19px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#0f1d52;color:var(--snow);margin-bottom:6px}
.lb{display:block;font-weight:700;margin-bottom:4px}

/* map */
.mapHead{text-align:center}.pieces{display:flex;justify-content:center;align-items:center;gap:5px;margin:6px 0;flex-wrap:wrap}
.pc{font-size:18px;opacity:.25;filter:grayscale(1)}.pc.on{opacity:1;filter:none;color:var(--gold)}.pc.gear.on{text-shadow:0 0 8px var(--gold)}
.sep{width:10px}.mapsub{font-size:14px;color:var(--mute);margin:4px 0 0}
.mapwrap{position:relative;margin:6px 0;background:linear-gradient(#132463,#0f1d52);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.trail{fill:none;stroke:#0a1230;stroke-width:16;stroke-linecap:round;vector-effect:non-scaling-stroke}
.trail2{fill:none;stroke:#e9f2ff;stroke-width:9;stroke-linecap:round;stroke-dasharray:2 14;vector-effect:non-scaling-stroke;opacity:.7}
.actlab{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:22px;color:var(--gold);transform:translateY(-50%);pointer-events:none;text-shadow:0 2px 6px #000}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #fff;background:radial-gradient(#3f63d6,#1d3585);display:grid;place-items:center;font-size:32px;padding:0;box-shadow:0 5px 0 #0a1230}
.node.done{background:radial-gradient(#3fcb85,#1f7a4d)}
.node.locked{background:#26335f;border-color:#55649a;filter:grayscale(.6);box-shadow:none}
.node.cur{animation:bob 1.6s ease-in-out infinite;border-color:var(--gold);box-shadow:0 0 0 5px #ffcf5a55,0 5px 0 #0a1230}
@keyframes bob{50%{transform:translateY(-6px)}}
.nlab{position:absolute;transform:translate(-50%,0);text-align:center;pointer-events:none;width:140px;line-height:1.1}
.nlab b{display:block;font-size:14px;text-shadow:0 2px 4px #000}.nlab small{display:block;text-shadow:0 1px 3px #000}
.nlab.locked{opacity:.6}.ns{display:block;color:var(--gold);font-size:13px}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kc{background:var(--gold);color:var(--ink);border-radius:999px;padding:0 7px;margin-left:4px;font-size:13px}

/* nav */
.nav{position:fixed;inset:auto 0 0;z-index:55;pointer-events:none}
.nav-in{pointer-events:auto;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--deep);border-top:2px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;box-shadow:0 -6px 20px #0008}
.nb{position:relative;background:none;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;min-height:52px;color:var(--mute);font-size:12px;font-weight:700}
.nb.on{color:var(--gold);background:#1d3585}.nb .dot{position:absolute;top:6px;right:26%;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--deep)}

/* overlays & sheets */
.ov{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}.ov.top{z-index:80;align-items:center}
.bd{position:absolute;inset:0;background:#050a1ccc;animation:fade .2s}
.sheet{position:relative;width:100%;max-width:600px;max-height:88vh;max-height:88dvh;background:var(--card);border:2px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:rise .25s ease-out;margin-inline:max(0px,env(safe-area-inset-left,0px))}
.sheet.wide{max-width:640px}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}.sh-h h2{font-size:28px}
.sh-b{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
@keyframes rise{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.pop{position:relative;width:min(92%,420px);background:var(--card);border:3px solid var(--gold);border-radius:24px;padding:20px 18px;text-align:center;animation:popin .35s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 50px #ffcf5a66;max-height:90dvh;overflow-y:auto}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.pop.r1{border-color:var(--r1);box-shadow:0 0 50px #5cc8ff55}.pop.r2{border-color:var(--r2);box-shadow:0 0 60px #c58bff77}.pop.r3{border-color:var(--r3);box-shadow:0 0 80px #ffcf5acc}
.biglv{font-family:var(--f-display);font-size:96px;color:var(--gold);line-height:1;text-shadow:0 4px 0 #8a1f1a}
.unl{background:var(--card2);border-radius:12px;padding:6px 10px;margin:6px 0}.unl small{display:block}
.more{display:block;margin-top:6px}.up{color:#7be0a8}
.burstring{position:absolute;inset:-30px;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,#ffcf5a00,#ffcf5a33,#ffcf5a00 20%,#ffcf5a33 40%,#ffcf5a00 60%,#ffcf5a33 80%,#ffcf5a00);animation:spin 12s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}

/* gear */
.glist,.ilist,.plist,.olist,.blist,.ablist{display:flex;flex-direction:column;gap:8px}
.gear{display:flex;gap:10px;text-align:left;background:#0f1d52;border:2px solid var(--r0);border-radius:14px;padding:8px 10px;--c:var(--r0)}
.gear.r1{border-color:var(--r1);--c:var(--r1)}.gear.r2{border-color:var(--r2);--c:var(--r2);box-shadow:0 0 12px #c58bff44}.gear.r3{border-color:var(--r3);--c:var(--r3);box-shadow:0 0 16px #ffcf5a66;background:linear-gradient(135deg,#2a2a50,#0f1d52)}
.gear.eq{background:#17306f}.gear.empty{opacity:.55;border-style:dashed}
.gi{font-size:32px;flex:none}.gn{font-weight:800;color:var(--c)}.gn em{color:var(--gold);font-style:normal}.gm{font-size:12px;color:var(--mute)}
.gs{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}.gs .st{font-size:12px;font-weight:800;border-radius:6px;padding:0 6px;color:var(--ink)}
.gs .st.might{background:var(--might)}.gs .st.sparkle{background:var(--sparkle)}.gs .st.sneak{background:var(--sneak)}.gs .st.kind{background:var(--kind)}
.gp{font-size:13px}.gp b{color:var(--gold)}.gd{font-size:13px;color:var(--mute);font-style:italic}
.gwrap{display:flex;flex-direction:column;gap:4px}.gact{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.ucost{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;background:#24408f;border:2px solid var(--line);border-radius:12px;min-height:40px;font-weight:700}.tab.on{background:var(--gold);color:var(--ink);border-color:#fff0a8}
.item,.comp,.oi,.abi{display:flex;gap:10px;align-items:center;background:#0f1d52;border-radius:14px;padding:8px 10px}
.item .ib,.comp .cb{flex:1;min-width:0}.item small,.comp small{display:block}.ii,.ci{font-size:30px;flex:none}
.comp.lock{opacity:.5}.comp.on{outline:2px solid var(--gold)}.comp .pas{color:#7be0a8}.comp .as{color:var(--sparkle)}.comp .intro{font-style:italic}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mat{background:#0f1d52;border-radius:14px;padding:10px;text-align:center}.mat span{font-size:28px}.mat b{display:block;font-size:24px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:8px}.hbig{font-size:60px}.hn{font-size:22px}.hc{font-size:14px;color:var(--mute);margin-bottom:6px}
.stats{display:flex;flex-direction:column;gap:6px}.srow{display:flex;align-items:center;gap:10px;background:#0f1d52;border-radius:14px;padding:6px 12px}
.sn{flex:1;min-width:0}.sn b{display:block}.sn.might b{color:var(--might)}.sn.sparkle b{color:var(--sparkle)}.sn.sneak b{color:var(--sneak)}.sn.kind b{color:var(--kind)}
.sv{font-size:24px;font-weight:800;font-family:var(--f-display)}.sv small{font-family:var(--f-body)}
.plus{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--ink);border:0;font-size:24px;font-weight:800;animation:pulse .8s infinite alternate}
.derived{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;font-size:14px;color:var(--mute);font-weight:700}
.abi{flex-wrap:wrap}.abi.lock{opacity:.5}.abi small{width:100%}.cost{color:var(--gold);font-weight:800;font-size:13px}
.tree{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center;background:linear-gradient(#1f7a3f,#0f4a26);border-radius:18px;padding:16px;margin-bottom:10px;position:relative;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:60px;aspect-ratio:1.2}
.tree.gold{background:linear-gradient(#8a6410,#4a3410)}
.orn{width:40px;height:40px;border-radius:50%;background:#0a2415;display:grid;place-items:center;font-size:22px;opacity:.5}.orn.on{opacity:1;background:#fff2;box-shadow:0 0 12px var(--gold)}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tier{background:#0f1d52;border-radius:12px;padding:6px 10px;opacity:.55;font-size:14px}.tier.on{opacity:1;outline:2px solid var(--gold)}.tier b,.tier span{display:block}
.olist,.blist{display:grid;grid-template-columns:1fr 1fr;gap:6px}.oi{flex-direction:column;align-items:flex-start;gap:0;opacity:.55}.oi.on{opacity:1}.oi span{font-size:24px}
.bdg{background:#0f1d52;border-radius:12px;padding:6px 10px;opacity:.5}.bdg.on{opacity:1;outline:2px solid var(--gold)}.bdg b,.bdg small{display:block}
.advgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

en('drake',{n:'Icicle Drake',i:'🐲',lv:4,boss:true,weak:'might',fr:6,likes:['cocoa','cupcake'],drop:'frostfinCharm',ally:'sniffles',aura:'blue',
  pat:[mv('Tail Swish','light'),mv('Achoo Snowball','heavy'),mv('Icy Wail','special','freeze'),mv('Sniffle','guard')],
  phases:[{at:.5,line:'The Drake sneezes so hard the lake rattles! His sneezes come faster now!',pat:[mv('Achoo Snowball','heavy'),mv('Tail Swish','light'),mv('Achoo Snowball','heavy'),mv('Sniffle','guard')]}],
  tip:'He is sniffly and sad. Hot cocoa fixes almost everything.',
  hurt:['The drake lets out a soft "aww" and a puff of frost.','His red nose gets redder.','"Ow! Sorry! ACHOO!"'],
  miss:['He sneezes right then and the wind blows your move away.','You miss. He says "Sorry!" automatically.','Your move slides across the ice.'],
  intro:'The Icicle Drake is a baby ice dragon the size of a pickup truck. His nose is bright red. "ACHOO! Sorry! Please do not come closer!"'});
en('gingers',{n:'Gingerbread Gang',i:'🍪',lv:5,weak:'sneak',fr:4,likes:['cupcake'],
  pat:[mv('Crumb Throw','light'),mv('Cookie Tackle','heavy'),mv('Sprinkle Scatter','light')],
  tip:'They are Nutmeg\'s cousins. They are crumbly, so a quick poke breaks them.',
  hurt:['A cousin loses an arm. "That is fine, I have another!"','Crumbs everywhere.','"I am so crumbly right now!"'],miss:['They scatter in six directions.','"Nope! Not today!"'],
  intro:'A gang of gingerbread cousins in tiny scarves blocks the way to the oven. Nutmeg waves nervously. "Hi, Gary."'});
en('golem',{n:'Fruitcake Golem',i:'🎂',lv:5,boss:true,weak:'kind',fr:7,likes:['cupcake','cookie'],drop:'figgyMitts',ally:'figgy',aura:'amber',
  pat:[mv('Cherry Roll','light'),mv('Cake Flump','heavy'),mv('Dense Brace','guard'),mv('Crumb Burst','special')],
  phases:[{at:.5,line:'The Golem mumbles: "Nobody ever eats me." His cherry eyes go wet and he swings harder!',pat:[mv('Cake Flump','heavy'),mv('Cherry Roll','light'),mv('Cake Flump','heavy'),mv('Dense Brace','guard')]}],
  tip:'He keeps saying nobody likes him. Maybe somebody should.',
  hurt:['A chunk of fruit tumbles off. "Ow. That was a cherry."','A candied pineapple slides off.','"Nobody ever does that."'],
  miss:['Your move sinks into the cake and gets stuck.','A walnut deflects it. PING.','He wobbles but absorbs it. He is very dense.'],
  intro:'A pile of fruitcake the size of a refrigerator stomps over. Two cherries blink at you. "GOOD DAY. I AM FRUITCAKE."'});

/* ---------------- prologue ---------------- */
CH.prologue={id:'prologue',name:'Prologue',theme:'workshop',lv:1,start:'p1',nodes:{
 p1:{title:'The Day the Engine Went KA-SPLONG',text:[
   'It is Christmas Eve at the North Pole, and everything is going wrong in the most spectacular way.',
   'In the middle of Santa\'s workshop, the giant Jingle Engine (the machine that makes the sleigh fly) just went KA-SPLONG. Five glowing Jingle Gears blasted through the roof and landed all over the North Pole.',
   'Chief Tinsel|{name}! You are the new Snow Scout, right? Perfect timing! Without those gears the sleigh cannot fly tonight, and no kid gets presents. No pressure!',
   'Nutmeg|Hi! I am Nutmeg. I am a gingerbread cookie, I talk a lot, and I am NOT afraid of milk. Okay, a little afraid of milk.'],
  choices:[{t:'"I will find every gear!"',to:'p2',go:1},{t:'Ask Nutmeg why he is afraid of milk',to:'p1b'}]},
 p1b:{title:'Cookie Problems',text:[
   'Nutmeg|Dunking is a serious problem for a cookie, {name}. One minute you are hanging out, the next minute you are soggy. SOGGY. I have trust issues.',
   'He pulls a spare cookie out of his pocket and hands it to you. You decide not to ask where it came from.'],
  choices:[{t:'Pat Nutmeg on the head and get started',to:'p2',fx:{give:['cookie']},go:1}]},
 p2:{title:'Your Snow Scout Kit',text:[
   'Chief Tinsel dives into a closet and comes out wearing three scarves and holding a very sparkly chest.',
   'Chief Tinsel|Every Snow Scout gets a starter kit! Hat, toy, and a good luck charm. Oh, and a thermos of hot cocoa. Hot cocoa fixes almost everything.',
   'You open the chest. Inside is gear picked just for your class. Try it on!'],
  choices:[{t:'Open the Starter Chest',to:'p3',fx:{starter:true},go:1}]},
 p3:{title:'The Great Present Pile',text:[
   'Outside, a mountain of presents has slid across the workshop floor and blocked the door. A tiny elf is trapped on top, waving a flag that says HELP (and also SNACKS).',
   'Nutmeg|This is a Skill Check! You roll a twenty-sided die, add your stat, and try to beat the number. Pick the stat that sounds best for the job!'],
  choices:[
   {t:'Push the pile with all your strength',check:ck('might','e','Present Pusher','You plant your boots and shove.',{to:'p4',txt:'The whole pile slides aside like a sleepy snowplow. The elf throws confetti.',fx:{xp:1,bells:1}},{to:'p4',txt:'The pile slides halfway, then slides back, then slides on your foot. Ow. But the elf squeezes out the gap.',fx:{xp:.5,hp:-1}})},
   {t:'Float the presents away with sparkle',check:ck('sparkle','e','Sparkle Lift','You wave your hands and let sparkles lift the boxes.',{to:'p4',txt:'The presents drift up like balloons and settle neatly in a corner. The elf gives you a thumbs up.',fx:{xp:1,bells:1}},{to:'p4',txt:'Sparkle goes everywhere EXCEPT the presents. The elf is now very glittery and very happy.',fx:{xp:.5}})},
   {t:'Sneak a path through the gaps',check:ck('sneak','e','Gap Slip','You squeeze through the tiny gaps.',{to:'p4',txt:'In, out, over, under. The elf says you are the best tiptoer he has ever met.',fx:{xp:1,bells:1}},{to:'p4',txt:'You get stuck in a box labeled FRAGILE. It is a very polite box about it.',fx:{xp:.5}})},
   {t:'Talk the presents into moving',check:ck('kind','e','Kind Words','You say please. A lot of pleases.',{to:'p4',txt:'The presents are surprisingly moved. They slide aside, sniffling.',fx:{xp:1,bells:1}},{to:'p4',txt:'The presents ignore you, but the little elf feels so bad he climbs down on his own.',fx:{xp:.5}})}]},
 p4:{title:'Four Gears, Four Places',text:[
   'Chief Tinsel unrolls a huge map of the North Pole. Four glowing dots blink on it.',
   'Chief Tinsel|Gumdrop Forest, the Toy Factory, Frostfin Lake, and Mrs. Claus\'s Kitchen. The fifth gear flew all the way to Icicle Peak, so save that one for last!',
   'Nutmeg|You can rest at camp any time, buy goodies at the Jolly Jingle Shop, and open an Advent door every time you earn a key. Also, check your Hero screen when you level up!'],
  choices:[{t:'To the map!',to:'__map',go:1}]}
}};

/* ---------------- CHAPTER 1: Gumdrop Forest ---------------- */
chap({id:'forest',n:1,name:'Gumdrop Forest',icon:'🍬',theme:'forest',lv:1,act:1,start:'f1',gear:'forest',
 blurb:'Giant gumdrop trees, licorice vines, and a very sticky giant.',rematch:'gumbo',nodes:{
 f1:{title:'Gumdrop Forest',text:[
   'The trees here are made of GIANT gumdrops: red ones, green ones, and one purple one that looks suspicious. The ground is crunchy sugar, and every step goes crrrunch.',
   'Nutmeg|Do not lick anything. I mean it. I licked a tree once and I have thoughts about it.',
   'Far away, someone is sniffling. Closer, a trail of licorice vines twists through the trees.'],
  choices:[
   {t:'Follow the sniffling',to:'f_yeti'},
   {t:'Tiptoe through the Licorice Trail',check:ck('sneak','m','Licorice Limbo','You duck and weave under the sticky black vines...',{to:'f_gremlins',txt:'You glide under the vines like a ninja made of peppermint. You even spot a pouch of Jingle Dust.',fx:{xp:1,give:['dust']}},{to:'f_gremlins',txt:'Your boot sticks and you faceplant into a gumdrop. It is surprisingly bouncy and surprisingly sticky.',fx:{xp:.5,hp:-2}})},
   {t:'Look closely at the sparkly gumdrop',tag:'Secret',hide:G=>G.ornaments.o1,check:ck('sparkle','e','Gumdrop Glint','Something shiny is stuck deep inside a green gumdrop.',{to:'f1',txt:'You tickle the gumdrop with sparkle and it burps out a GOLDEN ORNAMENT shaped like a star!',fx:{orn:'o1',xp:1}},{to:'f1',txt:'The gumdrop wobbles, but the shiny thing stays put. Maybe try again later.',fx:{xp:.5}})}]},
 f_yeti:{title:'The Sniffling Mystery',text:[
   'In a clearing, a Marshmallow Yeti cub sits crying. His fluffy hand is stuck in a blob of Gumdrop Goo.',
   'Nutmeg|He is the cutest thing I have ever seen. I am not jealous. (I am a little jealous.)'],
  choices:[
   {t:'Pull him free!',check:ck('might','m','Goo Tug-of-War','You grab the cub\'s wrist, plant your feet, and pull.',{to:'f_yeti_ok',txt:'POP! The goo lets go and you both flop backward into a snowdrift.',fx:{xp:1.5,flag:{cub:1}}},{to:'f_yeti_ok',txt:'You pull. The goo pulls back. After a long fight it goes SPLORP and launches you into a bush.',fx:{xp:1,hp:-2,flag:{cub:1}}})},
   {t:'Sit with him and hum a song',check:ck('kind','e','Gentle Voice','You sit down beside him and hum a quiet little song.',{to:'f_yeti_ok',txt:'He calms down, and so does the goo. His hand slips free all by itself. A calm heart works wonders.',fx:{xp:2,give:['dust'],flag:{cub:1}}},{to:'f_yeti_ok',txt:'He cries a bit more, then laughs at your funny face. The goo gets bored and lets go.',fx:{xp:1,flag:{cub:1}}})}]},
 f_yeti_ok:{title:'A Fluffy Friend',text:[
   'The cub hugs your leg. Then he points at you, points at himself, and says, "Gloop gloop!"',
   'Nutmeg|He says his name is Fluff and he is coming with us. I did not argue because he has very big arms.'],
  choices:[{t:'Welcome Fluff to the team',to:'f_gremlins',fx:{ally:'fluff',xp:1},go:1}]},
 f_gremlins:{title:'Sugar Rush!',text:[
   'Three bouncy gremlins pop out of the sugar, vibrating. They ate WAY too much candy and now they cannot stop boinging.',
   'Gremlins|WHEEE! WHEEE! WHEEEEEEE!'],
  battle:{enemy:'gremlins',next:'f_riddle',peace:'f_riddle'}},
 f_riddle:{title:'The Purple Gumdrop',text:[
   'In the middle of the forest stands the big purple gumdrop. A candy padlock hangs on its side, with a tiny sign.',
   'Sign|Riddle me this: What falls in winter, covers everything in white, and never gets hurt?'],
  choices:G=>J.U.shuffle([
   {t:'Rain',to:'f_wrong'},
   {t:'Snow',to:'f_boss_intro',fx:{xp:1.5,bells:1}},
   {t:'A very brave hat',to:'f_wrong'}])},
 f_wrong:{title:'BOING!',text:['The lock goes BOING and a gumdrop pops off a tree and bonks you on the head. Nutmeg snorts.','Nutmeg|Think about the white stuff. The cold, fluffy white stuff!'],
  choices:[{t:'Try the riddle again',to:'f_riddle',fx:{hp:-.5}}]},
 f_boss_intro:{title:'Not a Tree',text:[
   'The padlock pops open. The purple "tree" shivers. Two giant eyes open on its side.',
   'Gumbo|HIC! Who tickled my lock? I was having a lovely nap! I have a Jingle Gear in my tummy and nobody is taking it!',
   'Nutmeg|Okay. So that is a giant gumdrop. That is a thing I did not know could happen.'],
  choices:[{t:'Face Gumbo!',to:'f_boss',go:1}]},
 f_boss:{title:'Gumbo the Gumdrop Giant',text:['Gumbo wobbles up, dripping goo. Hiccups shake the forest.'],
  battle:{enemy:'gumbo',next:'f_fight_end',peace:'f_peace_end',boss:true}},
 f_peace_end:{title:'A Sweet Surprise',text:[
   'Gumbo takes a bite of the cookie and his whole body glows like a strawberry lamp.',
   'Gumbo|Nobody ever brought me a snack before. HIC! Here, take the gear. I only swallowed it because I was lonely.',
   'He gives a big squishy hug and a Jingle Gear pops out of his tummy, warm and humming.'],
  choices:[{t:'Take the gear and wave goodbye',to:'__finish',go:1}]},
 f_fight_end:{title:'A Sticky Victory',text:[
   'Gumbo flops to the ground with a soft BLOOP. A Jingle Gear pops out of his tummy and rolls to your feet.',
   'Gumbo|Hic. Ow. I was only guarding it because I got scared when it fell on me.',
   'You say sorry. He gives you a gumdrop as a peace offering. It is a good one.'],
  choices:[{t:'Take the gear and head back',to:'__finish',go:1}]}
},
 finish:{xp:3,bells:4,gear:'forest',txt:'The first Jingle Gear is yours! Nutmeg does a cartwheel and loses a gumdrop eye. "It is fine! It is decoration!"'}});

/* ---------------- CHAPTER 2: Toy Factory ---------------- */
chap({id:'factory',n:2,name:'Toy Factory',icon:'🤖',theme:'factory',lv:2,act:1,start:'fa1',gear:'factory',
 blurb:'Conveyor belts zoom, robots salute, and a teddy yells AAAAAA.',rematch:'rattlebot',nodes:{
 fa1:{title:'Toy Factory Chaos',text:[
   'Inside the Toy Factory, the conveyor belts are zooming at triple speed. Wind-up robots salute each other and fall over. A teddy bear on a pogo stick goes by yelling "AAAAAA!" every four seconds.',
   'Nutmeg|The Jingle Gear zapped the Boss Bot, and he has been bossy ever since. We need to get past the belts and find him.'],
  choices:[
   {t:'Catch presents as they zoom by',to:'fa_catch_intro',tag:'Mini-game'},
   {t:'Sneak along the rafters',check:ck('sneak','m','Beam Balance','You step onto a narrow beam above the parade of toys.',{to:'fa_pogo',txt:'You tiptoe over the toys without a sound. A Lucky Mistletoe is hanging from a bow, so you grab it.',fx:{xp:1,give:['mistletoe']}},{to:'fa_pogo',txt:'A rubber duck on a spring bonks you off the beam. You land in a bin of bouncy balls. Ow, boing, ow.',fx:{xp:.5,hp:-2}})},
   {t:'Hold back the conveyor belt',check:ck('might','m','Belt Stopper','You grab the giant lever and heave.',{to:'fa_pogo',txt:'The belt groans... slows... stops. Every toy goes "oh." There is a cookie on the belt, so you take it.',fx:{xp:1,give:['cookie']}},{to:'fa_pogo',txt:'The lever wins. You ride the belt around twice and wave at the toys.',fx:{xp:.5,hp:-2}})},
   {t:'Check the box marked DO NOT OPEN',tag:'Secret',hide:G=>G.ornaments.o2,check:ck('sneak','e','Quiet Opener','You lift the lid a tiny bit at a time.',{to:'fa1',txt:'Inside, a toy soldier is sleeping on a GOLDEN ORNAMENT shaped like a bolt. He mumbles "five more minutes" and you tiptoe off with it.',fx:{orn:'o2',xp:1}},{to:'fa1',txt:'A jack-in-the-box jumps out and yells BOO. You scream. He screams. Everyone screams. You close the lid.',fx:{hp:-1,xp:.5}})}]},
 fa_catch_intro:{title:'Gift Catch!',text:[
   'A chute drops finished presents onto the belt faster than any elf can wrap. Chief Tinsel\'s voice crackles on the factory radio.',
   'Chief Tinsel|Catch the presents in the sack! Dodge the lumps of coal! Slide left and right with your finger, the arrows, or the arrow keys!'],
  mini:{type:'catch',title:'Gift Catch',time:22,outcomes:[
    {min:0,to:'fa_pogo',txt:'You catch a few and the rest bounce around. The elves clap anyway.',fx:{xp:.5,bells:1}},
    {min:1,to:'fa_pogo',txt:'Nice catching! The elves pat you on the back with candy canes.',fx:{xp:1,bells:2,mats:{sugar:1}}},
    {min:2,to:'fa_pogo',txt:'Excellent! A shower of tinsel rains down and the elves cheer.',fx:{xp:1.5,bells:3,mats:{tinsel:1}}},
    {min:3,to:'fa_pogo',txt:'PERFECT! You catch every present. A Gear Bit rolls out of the chute as a tip.',fx:{xp:2,bells:4,mats:{bits:2,tinsel:1},give:['giftbox']}}]}},
 fa_pogo:{title:'Pogo Patrol',text:['Two teddy bears on pogo sticks block the conveyor belt, bouncing in perfect time.','Nutmeg|Do not look at their eyes. They are BUTTON eyes. They see everything.'],
  battle:{enemy:'pogo',next:'fa_boss_intro',peace:'fa_boss_intro'}},
 fa_boss_intro:{title:'Sir Rattle-Bot',text:['At the far end of the factory, a robot taller than a snowman stands on a stack of boxes, mustache sproinging.','Sir Rattle-Bot|HALT! NO ONE PASSES THE BELT! I AM VERY BUSY! I AM ALSO VERY WOUND UP!'],
  choices:[{t:'Face Sir Rattle-Bot!',to:'fa_boss',go:1}]},
 fa_boss:{title:'Sir Rattle-Bot',text:['Gears grind. Springs sproing. The boss bot cracks his knuckles, and one of them falls off.'],
  battle:{enemy:'rattlebot',next:'fa_fight_end',peace:'fa_peace_end',boss:true}},
 fa_peace_end:{title:'A Very Organized Friend',text:[
   'You hold out the gift box. Sir Rattle-Bot opens it very slowly. Inside is a tiny toy mustache comb.',
   'Sir Rattle-Bot|Oh. OH. It is exactly what I needed. I was yelling, wasn\'t I? I was too wound up.',
   'He pats his chest and a Jingle Gear pops out, spinning on the floor. "I only wanted to be a good boss. Sorry about the duck."'],
  choices:[{t:'Take the gear and say thanks',to:'__finish',go:1}]},
 fa_fight_end:{title:'Winding Down',text:[
   'Sir Rattle-Bot winds down, slow and sleepy. His eyes dim, then flicker back to a soft glow.',
   'Sir Rattle-Bot|Oh no. I was yelling, wasn\'t I? The gear made me feel too fast.',
   'A Jingle Gear pops out of his chest. "Take it. I will go back to organizing the ribbons."'],
  choices:[{t:'Take the gear and say sorry',to:'__finish',go:1}]}
},
 finish:{xp:3,bells:5,gear:'factory',mats:{bits:3},txt:'Gear number two! Sir Rattle-Bot salutes you so hard his hand falls off. "Not a problem!"'}});

/* ---------------- CHAPTER 3: Frostfin Lake ---------------- */
chap({id:'lake',n:3,name:'Frostfin Lake',icon:'⛸️',theme:'lake',lv:4,act:1,start:'la1',gear:'lake',
 blurb:'A frozen lake shaped like a snowflake, and one sniffly dragon.',rematch:'drake',nodes:{
 la1:{title:'Frostfin Lake',text:[
   'Frostfin Lake is frozen solid and shaped like a giant snowflake. Elves skate in circles while a snow owl in a tiny judge\'s wig holds up scorecards: 9.5, 9.7, and 3.',
   'Nutmeg|I cannot skate. I have no ankles.',
   'On the far shore, a cave glows icy blue. Something big sneezes in there, and a snowball shoots out like a cannonball.'],
  choices:[
   {t:'Skate across the lake for the judges',to:'la_skate_intro',tag:'Mini-game'},
   {t:'Freeze a bridge of sparkle ice',check:ck('sparkle','m','Sparkle Bridge','You wave your hands and a trail of sparkle spreads over the ice.',{to:'la_pixies',txt:'A glittering path stretches to the far shore. Nutmeg slides across on his tummy and says it was on purpose.',fx:{xp:1,give:['cookie']}},{to:'la_pixies',txt:'The bridge goes CRACK and you step in a puddle. Your sock is now a very cold sock.',fx:{xp:.5,hp:-2}})},
   {t:'Peek under the thin ice',tag:'Secret',hide:G=>G.ornaments.o3,check:ck('sparkle','m','Ice Window','You melt a tiny window in the ice with sparkle.',{to:'la1',txt:'Something blue glints below. You fish out a GOLDEN ORNAMENT shaped like a frozen heart. It is cold but it feels warm.',fx:{orn:'o3',xp:1}},{to:'la1',txt:'The window refreezes before you can reach. A fish gives you a very judgmental look.',fx:{xp:.5}})}]},
 la_skate_intro:{title:'Fancy Skating',text:[
   'You lace up borrowed skates (they are two sizes too big and smell like peppermint) and glide out. The Judge Owl clears his throat.',
   'Judge Owl|Hoo! Stop the glowing marker in the green zone to land your moves. Three moves, three scores. I am very strict. Hoo!'],
  mini:{type:'timing',title:'Fancy Skating',rounds:3,outcomes:[
    {min:0,to:'la_pixies',txt:'You wobble, spin, and slide into the snowbank. The owl holds up a 3. "Brave! Hoo!"',fx:{xp:.5,hp:-1}},
    {min:1,to:'la_pixies',txt:'A wobbly spin and a landing. The owl holds up a 6. "Acceptable. Hoo."',fx:{xp:1,bells:1}},
    {min:2,to:'la_pixies',txt:'Two smooth moves! The owl holds up an 8.5 and the elves toss you bells.',fx:{xp:1.5,bells:3}},
    {min:3,to:'la_pixies',txt:'PERFECT TEN! The owl faints, wakes up, and cheers. You win a Frostfin ribbon and a box of treats.',fx:{xp:2,bells:4,give:['cupcake'],mats:{gem:1}}}]}},
 la_pixies:{title:'Giggling Trouble',text:['A cloud of frost pixies swirls out of the reeds, giggling and flinging snowflakes.','Nutmeg|They look nice. They are NOT nice. They put my hat on a penguin.'],
  battle:{enemy:'pixies',next:'la_boss_intro',peace:'la_boss_intro'}},
 la_boss_intro:{title:'The Icicle Drake',text:[
   'The Icicle Drake is a baby ice dragon the size of a pickup truck. His nose is bright red, and his eyes are watery.',
   'Icicle Drake|ACHOO! Sorry! ACHOO! I cannot stop! Please do not come closer, ACHOO!',
   'Nutmeg|He looks more scared than scary. Also, the Jingle Gear is clearly under his tail.'],
  choices:[{t:'Step toward the Drake',to:'la_boss',go:1}]},
 la_boss:{title:'The Sniffly Dragon',text:['The Drake sneezes and a snowball the size of a beach ball zooms over your head.'],
  battle:{enemy:'drake',next:'la_fight_end',peace:'la_peace_end',boss:true}},
 la_peace_end:{title:'A Warm Cup of Friendship',text:[
   'The Drake takes a slow sip of cocoa. His nose goes from red to pink to normal.',
   'Icicle Drake|Ahhh. Thank you. I have been sneezing for three days. Nobody wanted to get close.',
   'He lifts his tail and a Jingle Gear rolls out. He had been using it as a heating pad.',
   'Icicle Drake|Take it! And can I come with you? I am very good at sneezing on bad guys.'],
  choices:[{t:'Hug the Drake (carefully) and take the gear',to:'__finish',go:1}]},
 la_fight_end:{title:'Oh No',text:[
   'Nutmeg|We won, so why do I feel like a bad cookie?',
   'Under the Drake\'s tail, you see a glowing Jingle Gear. He had been keeping it warm because he had a cold. That is all. He was just cold and sneezy, and now he is sad.',
   'You say sorry. He gives a tiny sniffly nod and sneezes a single gentle snowflake onto your nose.'],
  choices:[{t:'Take the gear and promise to visit',to:'__finish',go:1}]}
},
 finish:{xp:3,bells:5,gear:'lake',txt:'Gear number three! Nutmeg goes back to being scared of milk, but only a little.'}});

/* ---------------- CHAPTER 4: Mrs. Claus's Kitchen ---------------- */
chap({id:'kitchen',n:4,name:"Mrs. Claus's Kitchen",icon:'🍪',theme:'kitchen',lv:5,act:1,start:'k1',gear:'kitchen',
 blurb:'Cinnamon, vanilla, and one very stubborn fruitcake.',rematch:'golem',nodes:{
 k1:{title:"Mrs. Claus's Great Kitchen",text:[
   'The kitchen smells like cinnamon, vanilla, and warm hugs. Mrs. Claus waves a wooden spoon at you. She is covered in flour from head to toe.',
   'Mrs. Claus|Oh, thank goodness! A Jingle Gear landed in my fruitcake pile and now one of them is walking around. It is very polite but VERY stubborn. Help me bake something to calm it down!',
   'Nutmeg|(whispers) Is it okay that I am a cookie in this kitchen? Nobody is going to... eat me?',
   'Mrs. Claus|Never, sweet crumb.'],
  choices:[
   {t:'Decorate cookies for the party',to:'k_deco_intro',tag:'Mini-game'},
   {t:'Stir in the secret ingredient: love',check:ck('kind','m','Secret Ingredient','You stir slowly, thinking about everyone who will eat these cupcakes tonight.',{to:'k_gingers',txt:'The cupcakes glow warm and gold. Mrs. Claus tears up a little. "That is it exactly, dear."',fx:{xp:1,give:['cupcake','cupcake']}},{to:'k_gingers',txt:'They come out a little lopsided, but they smell wonderful. You keep one.',fx:{xp:.5,give:['cupcake']}})},
   {t:'Search the spice shelf',tag:'Secret',hide:G=>G.ornaments.o4,check:ck('sneak','m','Spice Search','You climb the shelf past jars of nutmeg (no relation), cloves, and star anise.',{to:'k1',txt:'Behind the cinnamon sticks you find a GOLDEN ORNAMENT shaped like a cinnamon swirl. It smells amazing.',fx:{orn:'o4',xp:1}},{to:'k1',txt:'You knock over the paprika. Everyone sneezes for a full minute.',fx:{hp:-1,xp:.5}})}]},
 k_deco_intro:{title:'Cookie Decorating',text:[
   'Mrs. Claus slides a tray of plain cookies in front of you and hands you a frosting bag the size of a cat.',
   'Mrs. Claus|Squeeze when the sprinkle ring is in the green! Three cookies. Make them pretty!'],
  mini:{type:'timing',title:'Cookie Decorating',rounds:3,outcomes:[
    {min:0,to:'k_gingers',txt:'The cookies look like abstract art. Mrs. Claus says "Bold choices!" and gives you one anyway.',fx:{xp:.5,give:['cookie']}},
    {min:1,to:'k_gingers',txt:'One cookie looks great. The other two look like they lost a fight with frosting.',fx:{xp:1,give:['cookie']}},
    {min:2,to:'k_gingers',txt:'Two beautiful cookies! Mrs. Claus pins them to the board of fame.',fx:{xp:1.5,give:['cookie','cupcake']}},
    {min:3,to:'k_gingers',txt:'THREE PERFECT COOKIES! Mrs. Claus declares you an honorary baker and hands you a tin of treats.',fx:{xp:2,give:['cupcake','cupcake'],mats:{sugar:3,gem:1}}}]}},
 k_gingers:{title:'Cousins',text:['A gang of gingerbread cousins in tiny scarves blocks the way to the oven. Nutmeg waves nervously.','Nutmeg|Hi, Gary.','Gary|(sharpening a candy cane) Cousin. You betrayed the Crumb Family. You made friends with a HUMAN.'],
  battle:{enemy:'gingers',next:'k_boss_intro',peace:'k_boss_intro'}},
 k_boss_intro:{title:'The Fruitcake Golem',text:[
   'A pile of fruitcake the size of a refrigerator stomps over. Two cherries blink at you. A Jingle Gear glows in his chest.',
   'Fruitcake Golem|GOOD DAY. I AM FRUITCAKE. NOBODY EVER EATS ME. THEY JUST GIVE ME TO SOMEONE ELSE.',
   'Mrs. Claus|(whispers) He is very sensitive about it.'],
  choices:[{t:'Face the Fruitcake Golem',to:'k_boss',go:1}]},
 k_boss:{title:'The Fruitcake Golem',text:['The golem sways. A cherry rolls out of his eye. "I will protect this gear! It is the only thing anybody has ever given me!"'],
  battle:{enemy:'golem',next:'k_fight_end',peace:'k_peace_end',boss:true}},
 k_peace_end:{title:'Taste Test',text:[

   'Fruitcake Golem|You... ate me? ON PURPOSE?',
   'His cherry eyes sparkle. Then he hugs you very gently, and it is like being hugged by a warm pillow made of dessert.',
   'He opens his chest and hands over the Jingle Gear. Mrs. Claus slips a tin of treats into your pack.'],
  choices:[{t:'Take the gear and the cookie tin',to:'__finish',fx:{give:['cookie','cookie','cupcake']},go:1}]},
 k_fight_end:{title:'Crumbs and Feelings',text:[

/* ---------------- CHAPTER 5: Icicle Peak ---------------- */
chap({id:'peak',n:5,name:'Icicle Peak',icon:'🏔️',theme:'peak',lv:7,act:1,start:'pk1',gear:'peak',
 blurb:'A glittering mountain, a staircase of ice, and one lonely troll.',rematch:'grimble',nodes:{
 pk1:{title:'Icicle Peak',text:[
   'With four gears in your pack, the Jingle Engine hums far away like a happy kitten.',
   'Icicle Peak stabs into the clouds, glittering. The only way up is a staircase made of ice with no railings at all.',
   'Nutmeg|I would like to say I am brave, but my knees are crumbs.'],
  choices:[
   {t:'Climb up, step by step',check:ck('might','m','Icy Climb','You dig your boots into each icy step and haul yourself upward.',{to:'pk_squad',txt:'Strong and steady! You reach the top without a single wobble.',fx:{xp:1}},{to:'pk_squad',txt:'You slip twice and slide down five steps. Third time works. You arrive huffing.',fx:{xp:.5,hp:-2}})},
   {t:'Tiptoe along the frozen edge',check:ck('sneak','m','Edge Walker','You balance along the edge of the staircase.',{to:'pk_squad',txt:'Light as a snowflake! You reach the top and Nutmeg arrives right behind you, holding his breath.',fx:{xp:1}},{to:'pk_squad',txt:'A patch of ice gives way and you slide down on your tummy. You make it, but your pants are very cold.',fx:{xp:.5,hp:-2}})},
   {t:'Light the stairs with starlight',check:ck('sparkle','m','Star Stairs','You wave your hands and little lights bloom on every step.',{to:'pk_squad',txt:'The stairs glow like a runway. You skip all the way up.',fx:{xp:1}},{to:'pk_squad',txt:'The lights flicker and go out halfway up. You finish the climb in the dark, saying "nope nope nope."',fx:{xp:.5,hp:-2}})},
   {t:'Chip the shiny icicle off the railing',tag:'Secret',hide:G=>G.ornaments.o5,check:ck('might','m','Icicle Chip','Something golden glints inside an icicle at the base of the stairs.',{to:'pk1',txt:'CRACK! A tiny GOLDEN ORNAMENT shaped like a crown tumbles out into your hand.',fx:{orn:'o5',xp:1}},{to:'pk1',txt:'You chip, chip, chip, and snap the icicle in half. The gold thing is still stuck inside.',fx:{xp:.5}})}]},
 pk_squad:{title:'The Snowball Squad',text:['Five snowballs with tiny scarves and angry eyebrows roll out of the cave.','Snowballs|PROTECT GRIMBLE! HE IS HAVING A VERY BAD DAY!'],
  battle:{enemy:'snowballs',next:'pk_grimble',peace:'pk_grimble'}},
 pk_grimble:{title:'Grimble the Chill',text:[
   'The cave opens into a room of ice. On a throne of icicles sits Grimble the Chill, a snow troll as wide as a bus, wearing a paper crown. He is hugging the fifth Jingle Gear like a teddy bear.',
   'Grimble|WHO DARES COME TO MY... uh... MY... *sniff*... cave?',
   'Nutmeg|(whispers) He is wearing a party hat. Why is he wearing a party hat?'],
  choices:[
   {t:'Ask Grimble why he is so grumpy',check:ck('kind','m','Listening Ears','You sit on the ice and ask quietly.',{to:'pk_story',txt:'Grimble blinks. Nobody has asked him that in a very long time.',fx:{xp:1.5,flag:{talked:1}}},{to:'pk_story',txt:'He turns away, but you saw his lip wobble.',fx:{xp:.5}})},
   {t:'Challenge him to a Snowball Showdown',to:'pk_battle'}]},
 pk_story:{title:'Grimble Tells the Truth',text:G=>G.flags.talked?[
    'Grimble|Every year I hear the elves singing at the Workshop party, and I am never invited. So I took a gear. If there is no Christmas, nobody has a party without me. That was dumb, wasn\'t it?',
    'Nutmeg|(sniffling) I am not crying. That is frosting.']:[
    'Grimble|You would not understand! Nobody understands! SNOWBALL TIME!',
    'He stands up and the whole cave shakes. But you notice his paper crown is crooked and his eyes are wet.'],
  choices:G=>G.flags.talked?[
    {t:'"Come to the Christmas Eve party with us!"',to:'pk_peace_end',fx:{flag:{friend_peak:1},ally:'grimble',xp:2},go:1},
    {t:'Hold on, the gear first',to:'pk_battle',alt:1}]:[
    {t:'Stand your ground',to:'pk_battle',go:1}]},
 pk_battle:{title:'The Big Chill',text:['Grimble stomps. The whole mountain trembles and a thousand icicles shiver.','Grimble|FINE! IF YOU WANT THE FIFTH GEAR, YOU WILL HAVE TO WIN IT!'],
  battle:{enemy:'grimble',next:'pk_fight_end',peace:'pk_peace_end',boss:true}},
 pk_peace_end:{title:'A Seat at the Party',text:G=>{
    const L=['You put down your pack and tell Grimble there is a seat at the Workshop party with his name on it.',
     'Grimble|Me? At the party? With the ELVES?',
     'He cries a snow shower so big the cave fills with flurries. Then he scoops you up in a gigantic, freezing hug.',
     'Grimble|Here! Take the gear! And can I bring snacks? I make a very good ice cream sandwich.'];return L},
  choices:[{t:'Take the fifth gear and head home',to:'pk_engine',go:1}]},
 pk_fight_end:{title:'The Quiet Cave',text:[
   'Grimble holds out the gear without looking at you.','Grimble|Just take it. Go. Have your party.',
   'Nutmeg|We won, so why does it feel like losing?','You look at Grimble. His paper crown. His empty cave. You can still make this right.'],
  choices:[
   {t:'"Come to the party with us, Grimble."',to:'pk_engine',fx:{ally:'grimble',flag:{friend_peak:1},xp:2},go:1},
   {t:'Take the gear and go',to:'pk_engine',alt:1}]},
 pk_engine:{title:'The Jingle Engine Roars',theme:'workshop',text:[
   'Back at the Workshop, you slot all five gears into the Jingle Engine. It sputters... coughs... then goes JINGLE-JANGLE-BOOM-SHAKALAKA in a burst of golden light.',
   'Outside, the sleigh hums and rises off the ground, eight reindeer in goofy sweaters hitched up and ready.',
   'Santa|Ho ho HO! Well done, {name}! You have saved Christmas! And with only one small explosion!',
   'The whole workshop cheers. Elves toss tinsel. Nutmeg does a cartwheel into a fruit bowl.'],
  choices:[{t:'Celebrate!',to:'pk_hush',go:1}]},
 pk_hush:{title:'The Great Hush',theme:'hush',text:[
   'And then the lights go out.',
   'Not all at once. They fade one by one, like someone is tiptoeing down the hall and turning them off. The cheering gets quieter. Then Santa\'s laugh goes SHHH... and stops, mid-HO.',
   'A tall figure steps through the doorway in a white fur coat with a scarf pulled up over his mouth. Frost curls across the floor behind him.',
   'Baron Von Hush|(a whisper you hear in your bones) Such... noise. Such an enormous, tiresome noise.',
   'He lifts one gloved hand. Seven small silver bells rise out of the Engine and drift into his scarf.',
   'Baron Von Hush|The Seven Silver Bells. The voice of your holiday. I shall keep them in a place where it is always... quiet.',
   'The Engine stops. The sleigh drops. Every bell in the North Pole goes mute.'],
  choices:[{t:'Run after him!',to:'pk_hush2',go:1}]},
 pk_hush2:{title:'Beyond the Pole',theme:'hush',text:[
   'The Baron is gone before you reach the door. Only snow and silence remain.',
   'Chief Tinsel|(he mouths words, then finds a chalkboard and writes) THE BELLS ARE SCATTERED. SIX OF THEM BLEW ACROSS THE WORLD. THE LAST IS IN HIS SILENT CATHEDRAL.',
   'Nutmeg|Okay. New plan. We find six bells, we sneak into a cathedral, and we beat a guy whose whole thing is shushing. I can do that. I am VERY good at shouting.',
   'Santa gives you a gentle, frosted thumbs-up. He cannot say a word. He does not need to.'],
  choices:[{t:'Begin Act II: Beyond the Pole',to:'__finish',go:1}]}
},
 finish:{xp:4,bells:6,gear:'peak',txt:'The five gears are home. But the Hush has fallen on the North Pole... and six Silver Bells are waiting to be found. Act I complete!',act:1}});

/* ---------------- CHAPTER 6: Aurora Meadow ---------------- */
chap({id:'aurora',n:6,name:'Aurora Meadow',icon:'🌌',theme:'aurora',lv:9,act:2,start:'au1',bell:'aurora',
 blurb:'Dancing sky ribbons, a silent herd, and a stag who thinks you are the enemy.',rematch:'stag',nodes:{
 au1:{title:'Aurora Meadow',text:[
   'The meadow glows green and purple under ribbons of aurora light. Reindeer stand across the snow like statues, mouths open mid-neigh, mid-snort, mid-"nobody take my snack."',
   'Nutmeg|They are frozen quiet. Every one of them. Except...',
   'A young reindeer with oversized antlers is galloping in circles and kicking up snow. He tries to shout something. Nothing comes out. He looks at you and points frantically at the sky.'],
  choices:[
   {t:'Follow the young reindeer (Aurora Dash)',to:'au_run_intro',tag:'Mini-game'},
   {t:'Sneak past the frozen herd',check:ck('sneak','m','Statue Shuffle','You slip between motionless reindeer, careful not to knock anyone over.',{to:'au_wisps',txt:'You glide through the herd without bumping a single antler. You even find a snack tucked in a saddlebag.',fx:{xp:1,give:['cookie']}},{to:'au_wisps',txt:'You bump a reindeer. He tips over like a statue, silently. Nutmeg catches him. Mostly.',fx:{xp:.5,hp:-1}})},
   {t:'Reach for the tiny ribbon of light',tag:'Secret',hide:G=>G.ornaments.o6,check:ck('sparkle','m','Ribbon Catch','A ribbon of aurora has looped down low enough to touch.',{to:'au1',txt:'You tug the ribbon and it ties itself into a GOLDEN ORNAMENT shaped like a bow.',fx:{orn:'o6',xp:1}},{to:'au1',txt:'The ribbon slips through your fingers and tickles your nose. Achoo.',fx:{xp:.5}})}]},
 au_run_intro:{title:'Aurora Dash',text:[
   'The young reindeer leaps into a tiny sleigh and waves you aboard. You grab the reins. Above, ribbons of aurora loop and swirl.',
   'Dash|(moving his lips, no sound) GO GO GO!',
   'Nutmeg|Slide left and right to dodge the storm clouds and catch the glowing stars! Use your finger, the arrows, or the arrow keys!'],
  mini:{type:'sleigh',title:'Aurora Dash',time:26,outcomes:[
    {min:0,to:'au_wisps',txt:'You crash a few times. Dash gives you a look, then a nuzzle.',fx:{xp:.5,bells:1}},
    {min:1,to:'au_wisps',txt:'A bumpy ride, but you make it! Dash grins.',fx:{xp:1,bells:2,mats:{sugar:2}}},
    {min:2,to:'au_wisps',txt:'Smooth flying! Dash does a happy backflip in mid-air.',fx:{xp:1.5,bells:3,mats:{gem:1}}},
    {min:3,to:'au_wisps',txt:'PERFECT FLIGHT! The aurora swirls around you and leaves a trail of stardust.',fx:{xp:2,bells:5,give:['dust','dust'],mats:{gem:2}}}]}},
 au_wisps:{title:'Light Show Gone Wrong',text:['Ribbons of green and purple light loop down from the sky and form tiny angry faces.','Nutmeg|The aurora is mad. Why is the aurora mad?'],
  battle:{enemy:'wisps',next:'au_boss_intro',peace:'au_boss_intro'}},
 au_boss_intro:{title:'Thunderhoof',text:[
   'A mighty stag with antlers made of aurora blocks the end of the meadow. Frozen reindeer stand behind him like an audience.',
   'Thunderhoof|THE HUSH SENT YOU! YOU WILL NOT TAKE MY HERD! I HEARD THE BARON WHISPER YOUR NAMES!',
   'The young reindeer tries to yell something. No sound comes out. He points at you, then at his heart.',
   'Nutmeg|I think he is saying we are the GOOD guys.'],
  choices:[{t:'Face Thunderhoof',to:'au_boss',go:1}]},
 au_boss:{title:'Thunderhoof the Storm Stag',text:['Thunderhoof snorts a bolt of aurora lightning into the snow. The ground sizzles.'],
  battle:{enemy:'stag',next:'au_fight_end',peace:'au_peace_end',boss:true}},
 au_peace_end:{title:'Not the Enemy',text:[
   'You hold up the gift box. Thunderhoof sniffs it. His shoulders drop.',
   'Thunderhoof|You... are not with the Hush. Forgive me. They took the voices of my entire herd. I thought you were the next wave.',
   'The young reindeer bounds over and hugs his dad\'s leg. His name is Dash, and he wants to come with you.',
   'Thunderhoof|Take my silver bell. It fell out of the sky last night and I kept it safe. And take my son. He is fast, loud (when he can be), and very proud of his antlers.'],
  choices:[{t:'Take the Silver Bell and welcome Dash',to:'__finish',fx:{ally:'dash',flag:{friend_aurora:1}},go:1}]},
 au_fight_end:{title:'A Heavy Heart',text:[
   'Thunderhoof drops to one knee, antlers flickering.',
   'Thunderhoof|You are strong, young one. Too strong to be the enemy. Forgive me. I should have asked before I charged.',
   'He nods toward a silver bell resting on a mossy rock. The young reindeer with the oversized antlers bumps your hand with his nose, then gallops away to rejoin the herd.'],
  choices:[{t:'Take the Silver Bell and thank Thunderhoof',to:'__finish',go:1}]}
},
 finish:{xp:4,bells:6,bellp:'aurora',mats:{gem:3},txt:'The first Silver Bell rings softly in your pack, a single clear note in a world gone silent. The Engine hums back at it from far away.'}});

/* ---------------- CHAPTER 7: Peppermint Mines ---------------- */

    {min:2,to:'mi_crawlers',txt:'Clean chips! The crystals tumble out sparkling.',fx:{xp:1.5,bells:3,mats:{sugar:2,gem:2}}},
    {min:3,to:'mi_crawlers',txt:'PERFECT TAPPING! A cart of crystals spills out like a rainbow.',fx:{xp:2,bells:5,mats:{sugar:3,gem:3,bits:2},give:['dust']}}]}},
 mi_crawlers:{title:'Crunchy Trouble',text:['Rock candy crawlers pour out of the tunnel, shells sparkling like rainbow pebbles.','Nutmeg|They look delicious. I should not think that. I am a cookie.'],
  battle:{enemy:'crawlers',next:'mi_boss_intro',peace:'mi_boss_intro'}},
 mi_boss_intro:{title:'The Caramel Wyrm',text:[
   'The tunnel wall bulges and a giant snake of golden caramel uncoils, hissing sweetly.',
   'Caramel Wyrm|Sssssomeone is ssssinging. I do not like it. It makes me... ssssad. Leave my bell alone!',
   'Nutmeg|It is basically a very long, very angry candy bar.'],
  choices:[{t:'Face the Caramel Wyrm',to:'mi_boss',go:1}]},
 mi_boss:{title:'The Caramel Wyrm',text:['The Wyrm coils above you, dripping golden syrup. Candy crystals shiver on the walls.'],
  battle:{enemy:'wyrm',next:'mi_fight_end',peace:'mi_peace_end',boss:true}},
 mi_peace_end:{title:'Sweet Tooth',text:[
   'You hold out a cupcake. The Wyrm leans down very slowly and takes it with the tip of his tongue.',
   'Caramel Wyrm|Mmm. It has been ssssso long since anyone brought me ssssomething nice. I only kept the bell because it was the only ssssound left in my tunnel.',
   'You promise to bring it back. He hands it over with a gentle, sticky nudge.'],
  choices:[{t:'Take the bell and say thanks',to:'__finish',fx:{flag:{friend_mines:1}},go:1}]},
 mi_fight_end:{title:'Syrup and Silence',text:[
   'The Wyrm slumps into a puddle of warm caramel.',
   'Caramel Wyrm|Take the bell. It is not like it ever rang for me anyway.',
   'Nutmeg|Why do I feel bad? He was throwing caramel at me.'],
  choices:[{t:'Take the bell and say sorry',to:'__finish',go:1}]}
},
 finish:{xp:4,bells:6,bellp:'mines',mats:{sugar:4,gem:3},txt:'Silver Bell number two! It chimes a lovely little note that bounces off the candy walls.'}});

/* ---------------- CHAPTER 8: Snow Globe Village ---------------- */
chap({id:'village',n:8,name:'Snow Globe Village',icon:'🔮',theme:'village',lv:13,act:2,start:'sv1',bell:'village',
 blurb:'A whole town inside a giant snow globe, its choir gone silent.',rematch:'muffler',nodes:{
 sv1:{title:'Snow Globe Village',text:[
   'You push through a glass door in a hill and find yourself inside a giant snow globe. Tiny houses glow. Smoke curls from chimneys. Everybody is mid-song, mouths wide open, and nothing is coming out.',
   'Mayor Sleighbell|(finds a chalkboard and writes) THANK GOODNESS. THE HUSH ATE OUR CAROLS. WITHOUT THEM, THE GLOBE WILL STOP SNOWING FOREVER.',
   'Nutmeg|Wait. Do the carols come from the BELLS? Because we have two bells in our pack.',
   'A small bell sprite pokes out of the mayor\'s hat and rings a tiny, silvery ting. It is the only sound in the whole village.'],
  choices:[
   {t:'Wake up the Bell Choir',to:'sv_bell_intro',tag:'Mini-game'},
   {t:'Search the quiet houses',check:ck('sneak','m','House Hunt','You tiptoe through the little houses and peek inside.',{to:'sv_hush',txt:'Under a bed, you find a stash of caramel-coated bells and a note: "Property of Tink."',fx:{xp:1,give:['dust','cookie']}},{to:'sv_hush',txt:'You find a family frozen at the dinner table, forks halfway up. It is very rude to watch. You leave.',fx:{xp:.5}})},
   {t:'Study the tiny snow globe on the shelf',tag:'Secret',hide:G=>G.ornaments.o8,check:ck('sparkle','h','Globe Within','A smaller snow globe sits on a shelf, spinning by itself.',{to:'sv1',txt:'Your sparkle calls to it and it floats into your palm: a GOLDEN ORNAMENT in the shape of a tiny snow globe.',fx:{orn:'o8',xp:1.5}},{to:'sv1',txt:'The tiny globe resists and snaps back to the shelf. It is very proud.',fx:{xp:.5}})}]},
 sv_bell_intro:{title:'The Bell Choir',text:[
   'Tink the sprite dives into a rack of silver handbells. Each rings a different color: red, green, blue, gold.',
   'Tink|(ting ting ting, you somehow understand) Watch the order of the bells, then play it back! Each round gets longer. The choir needs the whole song to wake up!'],
  mini:{type:'memory',title:'Bell Choir',rounds:6,outcomes:[
    {min:0,to:'sv_hush',txt:'You miss the order and the bells go sour. The choir shivers. But a few carolers hum along.',fx:{xp:.5}},
    {min:1,to:'sv_hush',txt:'A short tune! A few carolers hum along.',fx:{xp:1,bells:2}},
    {min:2,to:'sv_hush',txt:'Beautiful! The choir joins in, singing a warm, quiet harmony.',fx:{xp:1.5,bells:3,give:['dust']}},
    {min:3,to:'sv_hush',txt:'PERFECT SONG! Snow falls inside the globe again, and the whole village sighs with relief.',fx:{xp:2,bells:5,give:['dust','cupcake'],mats:{gem:2}}}]}},
 sv_hush:{title:'Hushlings in the Square',text:['Floaty, scarf-shaped ghosts with no mouths drift out from behind the houses. They are very quiet. That is the scary part.','Tink|(ting, ting, TING!) They are coming for the choir!'],
  battle:{enemy:'hushlings',next:'sv_boss_intro',peace:'sv_boss_intro'}},
 sv_boss_intro:{title:'The Great Muffler',text:[
   'A scarf as long as a street rises over the village square, wrapping round and round the clock tower. Eyes of knitted yarn blink open.',
   'Great Muffler|SHHHHH. SHHHH. SHHH. Everything is quiet now. Isn\'t it nice?',
   'Tink hides behind your ear.',
   'Nutmeg|It is a scarf. It is a scarf with opinions.'],
  choices:[{t:'Unwrap the Muffler!',to:'sv_boss',go:1}]},
 sv_boss:{title:'The Great Muffler',text:['The scarf tightens around the clock tower. The whole village flinches.'],
  battle:{enemy:'muffler',next:'sv_fight_end',peace:'sv_peace_end',boss:true}},
 sv_peace_end:{title:'Unraveled',text:[
   'The Muffler goes loose and soft. He is not scary now, just a long, lonely scarf.',
   'Great Muffler|I was knitted for a boy who loved the quiet. He never came back for me. The Baron found me, and told me quiet was all that was left.',
   'Tink rings one clear note. The whole village hums along. The Muffler wiggles with joy.',
   'Great Muffler|I... I would like to be a scarf again. A warm one. Maybe for you?'],
  choices:[{t:'Take the Silver Bell and invite Tink along',to:'__finish',fx:{ally:'tink',flag:{friend_village:1}},go:1}]},
 sv_fight_end:{title:'A Village Exhales',text:[
   'The Muffler falls in a long woolly heap. The clock tower chimes for the first time in days.',
   'Mayor Sleighbell|(finally speaking in a cracked whisper) Thank you. Thank you, thank you.',
   'Tink flies to your shoulder. She rings one soft note. It sounds like a yes.'],
  choices:[{t:'Take the Silver Bell and bring Tink along',to:'__finish',fx:{ally:'tink'},go:1}]}
},
 finish:{xp:4,bells:7,bellp:'village',mats:{gem:3,sugar:3},txt:'Silver Bell number three, and a friend who rings when you are kind. Snow falls in the globe again, soft and slow and sparkling.'}});

})(JQ);
