/* ---------------- CHAPTER 9: The Wrapping Wing ---------------- */
chap({id:'wrap',n:9,name:'The Wrapping Wing',icon:'🎁',theme:'wrap',lv:14,act:2,start:'wr1',bell:'wrap',
 blurb:'A warehouse of ribbons and bows, tangled by a very worried spider.',rematch:'spider',nodes:{
 wr1:{title:'The Wrapping Wing',text:[
   'The Wrapping Wing is a warehouse bigger than a stadium, with conveyor belts, ribbon spools as tall as trees, and a million perfect bows. Usually. Today, ribbons hang from the ceiling in thick white webs.',
   'Nutmeg|Wrapped. All of it is wrapped. Including a door. Including a ceiling fan.',
   'Elf|(a tiny elf wrapped like a burrito) Mmmf mmm mmmfff! (Translation: the Silver Bell is inside the biggest present, up top.)'],
  choices:[
   {t:'Wrap gifts with the elves',to:'wr_wrap_intro',tag:'Mini-game'},
   {t:'Climb a ribbon rope to the top',check:ck('might','m','Ribbon Climb','You wrap the ribbon around your arm and haul yourself upward.',{to:'wr_tapes',txt:'Hand over hand, up and up. You reach the rafters and find a tin of treats.',fx:{xp:1,give:['cupcake']}},{to:'wr_tapes',txt:'The ribbon spins. You spin. You spin all the way back down. And up again. Eventually you make it.',fx:{xp:.5,hp:-2}})},
   {t:'Snip a path through the bows',check:ck('sneak','m','Silent Snip','You pull out tiny scissors and snip a way through the web.',{to:'wr_tapes',txt:'Snip, snip, snip. A path opens, and a Lucky Mistletoe falls out of a bow.',fx:{xp:1,give:['mistletoe']}},{to:'wr_tapes',txt:'You snip the wrong ribbon and a roll of paper unspools onto your head. You are now a present.',fx:{xp:.5,hp:-1}})},
   {t:'Peek inside the golden gift box',tag:'Secret',hide:G=>G.ornaments.o9,check:ck('sneak','h','Careful Unwrap','A golden box sits on a pedestal, its bow glowing.',{to:'wr1',txt:'You unwrap it without tearing a corner. Inside, a GOLDEN ORNAMENT shaped like a bow. Perfect.',fx:{orn:'o9',xp:1.5}},{to:'wr1',txt:'You tear a corner. The box sighs, sadly. Maybe try again.',fx:{xp:.5}})}]},
 wr_wrap_intro:{title:'Perfect Wrap',text:[
   'The tangled elves cheer when you pick up a roll of paper. The belt starts moving.',
   'Elf|Tape the paper when the marker is in the green! Perfect corners win a prize!'],
  mini:{type:'timing',title:'Perfect Wrap',rounds:4,outcomes:[
    {min:0,to:'wr_tapes',txt:'The presents look like crumpled pillows. The elves give you a very polite thumbs-up.',fx:{xp:.5,mats:{tinsel:1}}},
    {min:1,to:'wr_tapes',txt:'A couple of nice ones! The elves clap.',fx:{xp:1,bells:2,mats:{tinsel:2}}},
    {min:2,to:'wr_tapes',txt:'Sharp corners, tidy bows! The elves cheer.',fx:{xp:1.5,bells:3,mats:{tinsel:3,bits:1}}},
    {min:3,to:'wr_tapes',txt:'PERFECT WRAPS! The elves carry you on their shoulders and give you a golden roll of ribbon.',fx:{xp:2,bells:5,mats:{tinsel:4,bits:2},give:['giftbox','giftbox']}}]}},
 wr_tapes:{title:'Sticky Situation',text:['Rolls of sticky tape slither across the floor, trailing ribbon.','Nutmeg|Do not let them wrap me. I get wrapped at every party.'],
  battle:{enemy:'tapes',next:'wr_boss_intro',peace:'wr_boss_intro'}},
 wr_boss_intro:{title:'The Tangle-Tape Spider',text:[
   'A spider the size of a sleigh drops from the rafters on a thread of ribbon, eight legs wrapped in bows.',
   'Tape Spider|EVERYTHING MUST BE WRAPPED. EVERYTHING. NOTHING CAN BE LOOSE. LOOSE THINGS GET LOST!',
   'Nutmeg|He is shaking. Look at his legs. He is terrified.'],
  choices:[{t:'Face the Spider',to:'wr_boss',go:1}]},
 wr_boss:{title:'The Tangle-Tape Spider',text:['The Spider sprays ribbon across the warehouse, shaking.'],
  battle:{enemy:'spider',next:'wr_fight_end',peace:'wr_peace_end',boss:true}},
 wr_peace_end:{title:'Wrapped With Love',text:[
   'You hold out a gift box tied with a bow. The Spider stops. All eight legs go quiet.',
   'Tape Spider|It is wrapped. It is perfectly wrapped. Who did this?',
   'Tape Spider|I wrapped everything because the Hush came and took things away. I thought if I wrapped it tight, it would stay. Thank you for... letting me wrap something you wanted to keep.',
   'He climbs down and hands you the biggest present in the warehouse. Inside is a Silver Bell tied with a ribbon.'],
  choices:[{t:'Thank the Spider and unwrap the bell',to:'__finish',fx:{flag:{friend_wrap:1}},go:1}]},
 wr_fight_end:{title:'Loose Ends',text:[
   'The Spider slumps, ribbons trailing.','Tape Spider|It is all loose now. Everything is loose. What do I do?',
   'Nutmeg|(gently) Maybe wrap it again. But a little less tight this time.',
   'The Spider nods and hands you the big present with a trembling leg. Inside is a Silver Bell.'],
  choices:[{t:'Take the bell and help tidy up',to:'__finish',go:1}]}
},
 finish:{xp:4,bells:7,bellp:'wrap',mats:{tinsel:4,bits:3},txt:'Silver Bell number four! Act II is almost done. The Hush is growing louder in the silence, and the last two bells are close.',act:2}});

/* ---------------- CHAPTER 10: The Quiet Woods ---------------- */
chap({id:'woods',n:10,name:'The Quiet Woods',icon:'🌲',theme:'woods',lv:16,act:3,start:'wo1',bell:'woods',
 blurb:'A forest where even the wind forgot how to blow.',rematch:'alpha',nodes:{
 wo1:{title:'The Quiet Woods',text:[
   'Act III begins in a forest where no leaf moves and no twig snaps. The snow does not crunch. Even your own footsteps feel muffled.',
   'Nutmeg|(whispering) I am whispering because I am scared and also because the forest is making me.',
   'Tracks lead deeper. Big paw prints. Far away, something tries to howl and fails.'],
  choices:[
   {t:'Tiptoe in rhythm through the trees',to:'wo_tip_intro',tag:'Mini-game'},
   {t:'Follow the paw prints quietly',check:ck('sneak','m','Silent Tracker','You step in each print so you make no more noise than the hush itself.',{to:'wo_hounds',txt:'You follow the prints right to a tree stump, and find a cookie stash someone left. Nice.',fx:{xp:1,give:['cookie','cookie']}},{to:'wo_hounds',txt:'A twig cracks. In this forest it sounds like a cannon. Birds fly away silently.',fx:{xp:.5,hp:-2}})},
   {t:'Inspect the muffled bell tree',tag:'Secret',hide:G=>G.ornaments.o10,check:ck('kind','m','Gentle Touch','A tiny bell hangs from a branch, wrapped in a scarf.',{to:'wo1',txt:'You unwrap the scarf slowly and kindly. It rings once, beautifully, and drops a GOLDEN ORNAMENT shaped like a silent bell.',fx:{orn:'o10',xp:1}},{to:'wo1',txt:'You tug too hard. The bell hides inside its scarf. Maybe be gentler next time.',fx:{xp:.5}})}]},
 wo_tip_intro:{title:'Tiptoe Timing',text:[
   'The forest floor has patches of frozen crust that creak when you step on them. You need to land each foot in the quiet spot.',
   'Nutmeg|Tap when the marker is in the green. Five steps. Do NOT wake the bears. (There are no bears. Probably.)'],
  mini:{type:'timing',title:'Tiptoe Timing',rounds:5,outcomes:[
    {min:0,to:'wo_hounds',txt:'CRRRRACK. The forest holds its breath. A single owl blinks at you.',fx:{xp:.5,hp:-1}},
    {min:1,to:'wo_hounds',txt:'A few creaks, but you make it through.',fx:{xp:1,bells:2}},
    {min:2,to:'wo_hounds',txt:'Quiet as a snowflake. Mostly.',fx:{xp:1.5,bells:3,mats:{gem:1}}},
    {min:3,to:'wo_hounds',txt:'PERFECT TIPTOE! A shy fox follows you, then trots off with a tiny bow.',fx:{xp:2,bells:5,mats:{gem:2,tinsel:2},give:['dust']}}]}},
 wo_hounds:{title:'Quiet Teeth',text:['Wolf-shaped shadows prowl between the pines, snapping jaws without a sound.','Nutmeg|They are not growling. That is so much worse.'],
  battle:{enemy:'hounds',next:'wo_boss_intro',peace:'wo_boss_intro'}},
 wo_boss_intro:{title:'The Alpha',text:[
   'A wolf bigger than a horse steps out of the mist. His mouth opens in a howl that makes no sound at all.',
   'Alpha|(a rasping nothing) ...',
   'Nutmeg|His ears are down. His tail is down. Is it just me, or does he look like he is about to cry?'],
  choices:[{t:'Step toward the Alpha',to:'wo_boss',go:1}]},
 wo_boss:{title:'The Alpha Hush Hound',text:['The Alpha lowers his head and snaps. It is not a bite, it is a plea. But it still hurts.'],
  battle:{enemy:'alpha',next:'wo_fight_end',peace:'wo_peace_end',boss:true}},
 wo_peace_end:{title:'The First Howl',text:[
   'You hold out a cookie. The Alpha sniffs it, then licks your hand.',
   'He opens his mouth and a small, rusty AWOOOO escapes. Birds burst out of the trees. Snow falls from the branches.',
   'Alpha|AWOOOOOOO!',
   'A tiny pup trots out from behind a pine, tail wagging. He yips, then yaps, then yodels.',
   'Pip|AROO!',
   'The Alpha lowers his head and nudges something toward you: a Silver Bell, wrapped in fur to keep it warm.'],
  choices:[{t:'Take the bell and welcome Pip',to:'__finish',fx:{ally:'pip',flag:{friend_woods:1}},go:1}]},
 wo_fight_end:{title:'A Sad Sound',text:[
   'The Alpha lies in the snow, breathing heavily.','Alpha|(a rasp that might be a whimper)',
   'A tiny pup trots out from behind a pine and curls up against him. The Alpha nuzzles the pup and looks away.',
   'He pushes a Silver Bell wrapped in fur toward you with his nose.'],
  choices:[{t:'Take the bell and leave them a cookie',to:'__finish',fx:{give:[]},go:1}]}
},
 finish:{xp:5,bells:8,bellp:'woods',mats:{gem:4,tinsel:3},txt:'Silver Bell number five! Somewhere in the woods, a howl rises. It is the first sound in weeks.'}});

/* ---------------- CHAPTER 11: The Sleighyard ---------------- */
chap({id:'yard',n:11,name:'The Sleighyard',icon:'🛷',theme:'yard',lv:18,act:3,start:'yd1',bell:'yard',
 blurb:'A graveyard of old sleighs, a blizzard with a grudge, and one last bell.',rematch:'gale',nodes:{
 yd1:{title:'The Sleighyard',text:[
   'Old sleighs lie in drifts like frozen ships: candy-cane runners, jingle harnesses, one that is shaped like a swan. The wind whips snow in circles above them.',
   'Chief Tinsel|(over the radio, hoarse) The Silver Bell is in the oldest sleigh at the center. The Hush has turned the storm into a weapon. The Big Sleigh needs a new runner or Santa cannot fly even when the bells are back!',
   'Nutmeg|So: find a bell, fix a sleigh, beat a storm. Easy. I will hold the cocoa.'],
  choices:[
   {t:'Fly a rescue sled to the center',to:'yd_run_intro',tag:'Mini-game'},
   {t:'Fix the runner with scrap parts',check:ck('might','m','Runner Repair','You wrestle a crooked candy cane runner back into shape.',{to:'yd_wraiths',txt:'With a CLANG and a PING, the runner snaps in. It even has a little bell on the end.',fx:{xp:1,give:['bomb'],mats:{bits:2}}},{to:'yd_wraiths',txt:'The runner is slightly crooked, but it will do. You get a splinter and a big respect for sleigh mechanics.',fx:{xp:.5,hp:-2}})},
   {t:'Light a lantern in the old swan sleigh',tag:'Secret',hide:G=>G.ornaments.o11,check:ck('sparkle','h','Lantern Light','A tarnished lantern hangs from the swan sleigh, cold and dark.',{to:'yd1',txt:'You light it with sparkle and it blazes warm gold, dropping a GOLDEN ORNAMENT shaped like a tiny lantern.',fx:{orn:'o11',xp:1.5}},{to:'yd1',txt:'The lantern flickers, then goes out. It wants a brighter light than yours.',fx:{xp:.5}})}]},
 yd_run_intro:{title:'Blizzard Run',text:[
   'A little rescue sled sits at the edge of the yard. You hop on and the blizzard grabs you like a fist.',
   'Dash|(if you have him) Hold tight! Dodge the storm clouds, grab the stars, and slide left and right!',
   'Nutmeg|It is the same as before, but with more wind and way more screaming!'],
  mini:{type:'sleigh',title:'Blizzard Run',time:30,speed:1.25,outcomes:[
    {min:0,to:'yd_wraiths',txt:'The storm tosses you around like laundry. You land in a snowbank, spitting snow.',fx:{xp:.5,hp:-2}},
    {min:1,to:'yd_wraiths',txt:'Bumpy ride, but you make it to the center!',fx:{xp:1,bells:3,mats:{gem:1}}},
    {min:2,to:'yd_wraiths',txt:'Smooth flying through a nasty storm! Nutmeg applauds from under his blanket.',fx:{xp:1.5,bells:5,mats:{gem:2,bits:1}}},
    {min:3,to:'yd_wraiths',txt:'PERFECT RUN! You thread every cloud and the storm itself seems impressed.',fx:{xp:2,bells:7,mats:{gem:3,bits:2},give:['cocoa']}}]}},
 yd_wraiths:{title:'Storm Spirits',text:['The storm winds twist into tall figures with long, frosted fingers.','Nutmeg|Do not look at them. They are drafty.'],
  battle:{enemy:'wraiths',next:'yd_boss_intro',peace:'yd_boss_intro'}},
 yd_boss_intro:{title:'The Gale Wraith',text:[
   'The storm swirls into one tall, howling figure above the broken sleighs.',
   'Gale Wraith|THIS IS THE END OF YOUR SILLY HOLIDAY. NO MORE SLEIGHS. NO MORE FLYING. NO MORE JOY.',
   'Nutmeg|Okay, that was a little rude.'],
  choices:[{t:'Face the Gale Wraith',to:'yd_boss',go:1}]},
 yd_boss:{title:'The Gale Wraith',text:['The Wraith spins, and the sleighs rattle in their frozen graves.'],
  battle:{enemy:'gale',next:'yd_fight_end',peace:'yd_peace_end',boss:true}},
 yd_peace_end:{title:'Calm After the Storm',text:[
   'You hold up a warm light. The Wraith stops spinning. The snow drifts down.',
   'Gale Wraith|I was a gentle wind once. I carried the very first sleigh across the sky. The Hush made me forget what I was for.',
   'Warm air spreads over the yard. Snow melts off the sleighs. A silver bell rings softly from the old swan sleigh.',
   'Gale Wraith|I remember now. Let me carry you. One more flight.'],
  choices:[{t:'Take the bell and thank the wind',to:'__finish',fx:{flag:{friend_yard:1}},go:1}]},
 yd_fight_end:{title:'The Winding Down',text:[
   'The Wraith slows, thinner and thinner, until he is just a breeze.','Gale Wraith|...I am sorry. It was not supposed to be so cold.',
   'The snow settles. A silver bell rings softly from the old swan sleigh. The path is clear.'],
  choices:[{t:'Take the bell and mend the runner',to:'__finish',go:1}]}
},
 finish:{xp:5,bells:8,bellp:'yard',mats:{bits:4,gem:3},txt:'Silver Bell number six! The Big Sleigh has a new runner and a hopeful hum. Only the Baron remains.'}});

/* ---------------- CHAPTER 12: The Silent Cathedral ---------------- */
chap({id:'cathedral',n:12,name:'The Silent Cathedral',icon:'⛪',theme:'cathedral',lv:20,act:3,start:'ca1',bell:'cathedral',
 blurb:'A frozen hall of silence, and a Baron who has heard enough.',rematch:'baron',nodes:{
 ca1:{title:'The Silent Cathedral',text:[
   'The cathedral stands on a glacier at the edge of the world. Its spires are glass icicles. Its doors are twenty feet tall and covered in frost.',
   'Tink|(ting, ting) The last bell is in there. I can feel it. It is... very quiet.',
   'Nutmeg|I want to say something brave. I cannot think of anything. Can you say something brave?'],
  choices:[
   {t:'Push the great doors open',check:ck('might','m','Door Push','You put your shoulder to the frozen doors and push.',{to:'ca_knights',txt:'The doors groan open with a long, quiet creeeeak. Frost falls like snow.',fx:{xp:1}},{to:'ca_knights',txt:'The doors do not budge. You find a small side door. It is much more fun to go through the small door anyway.',fx:{xp:.5}})},
   {t:'Play the Hall of Bells',to:'ca_bells_intro',tag:'Mini-game'},
   {t:'Look behind the altar',tag:'Secret',hide:G=>G.ornaments.o12,check:ck('sneak','h','Altar Peek','Behind the great stone altar, something golden gleams at the very top of a tiny tree.',{to:'ca1',txt:'On a tiny, forgotten tree you find a GOLDEN ORNAMENT shaped like a star. It is the Star Topper.',fx:{orn:'o12',xp:1.5}},{to:'ca1',txt:'You trip over a candlestick that makes no sound as it falls. Spooky.',fx:{xp:.5}})}]},
 ca_bells_intro:{title:'The Hall of Bells',text:[
   'Hundreds of silent bells hang from the ceiling. In the middle, a stone pedestal holds seven empty slots, one for each Silver Bell.',
   'Tink|(ting) If you can play the carol, the bells will wake up. Watch the order of the bells, then play it back. Longer than ever.'],
  mini:{type:'memory',title:'Hall of Bells',rounds:8,outcomes:[
    {min:0,to:'ca_knights',txt:'The bells wobble but stay quiet. You still feel a tiny buzz in your chest.',fx:{xp:.5}},
    {min:1,to:'ca_knights',txt:'A few bells wake up and hum.',fx:{xp:1,bells:3}},
    {min:2,to:'ca_knights',txt:'A beautiful melody fills the hall, thin and brave.',fx:{xp:1.5,bells:5,give:['dust']}},
    {min:3,to:'ca_knights',txt:'PERFECT CAROL! Every bell wakes. The whole cathedral glows and a quiet cheer rolls through the ice.',fx:{xp:2,bells:8,give:['dust','cocoa'],mats:{gem:3}}}]}},
 ca_knights:{title:'The Knights of Hush',text:['Suits of silver-white armor stand in a line down the hall, each with a scarf across its face. They draw swords of ice.','Nutmeg|They are armored. I am a cookie. Tell me this is not a bad idea.'],
  battle:{enemy:'knights',next:'ca_baron_intro',peace:'ca_baron_intro'}},
 ca_baron_intro:{title:'Baron Von Hush',text:[
   'At the end of the hall, the Baron sits on a throne carved from a single block of ice. Seven silver bells hang from his scarf, wrapped in frost. A cold wind curls around him.',
   'Baron Von Hush|You came all this way for a handful of bells. How noisy of you.',
   'He rises slowly, tired and elegant.',
   'Baron Von Hush|Do you know what I remember about Christmas? The noise. All of it. The shouting, the laughing, the parties that did not include me. One Christmas Eve, nobody remembered to come get me. I stood outside the window and listened to everyone else having fun.'],
  choices:[
   {t:'"I am sorry. That sounds lonely."',to:'ca_talk',fx:{flag:{baronTalk:1},xp:2},go:1},
   {t:'"Give back the bells. Now!"',to:'ca_boss'}]},
 ca_talk:{title:'The Boy in the Window',text:[
   'Baron Von Hush|...It was a long time ago. I made my world quiet so it could never hurt again. I did not think I was taking Christmas from anyone. Only the noise.',
   'Nutmeg|(whispering to Tink) Can a villain cry? Because I think he is crying.',
   'The Baron straightens, voice hardening again.',
   'Baron Von Hush|But the bells are mine. Quiet is safer. I cannot let you take it back.'],
  choices:[{t:'Stand firm, but gently',to:'ca_boss',go:1}]},
 ca_boss:{title:'Baron Von Hush',text:['The cathedral bells shudder. Frost races across the floor. The Baron lifts both hands and the whole hall holds its breath.'],
  battle:{enemy:'baron',next:'ca_fight_end',peace:'ca_peace_end',boss:true}},
 ca_peace_end:{title:'The Last Bell',text:[
   'The Baron\'s scarf slips. He looks small without it, just an old boy in a big coat.',
   'Baron Von Hush|You... came back for me. After all that. Why?',
   'Nutmeg|Because Christmas is for everyone. Even the quiet ones. Even the ones who need a bit of both.',
   'Slowly, the Baron unwraps the Heart Bell from his scarf. It is the smallest bell, and it rings the loudest.',
   'Baron Von Hush|Take them. All of them. And... perhaps... might I come to the party? I could sit near the door. In case it gets too loud.',
   'Tink rings the Heart Bell. The cathedral bells answer one by one, all the way up to the glass spires.'],
  choices:[{t:'"There is always a seat for you."',to:'__finish',fx:{flag:{friend_cathedral:1,trueEnd:1,hushEnd:1}},go:1}]},
 ca_fight_end:{title:'Silence Broken',text:[
   'The Baron slumps against his throne. The seven silver bells glow in his scarf, then drift to your hands.',
   'Baron Von Hush|...Take them. I suppose a quiet Christmas is not going to happen this year.',
   'The cathedral bells begin to ring on their own. The sound rolls down the glacier like thunder. The Baron winces.',
   'He turns to the wall. You can see his shoulders shaking.'],
  choices:[
   {t:'Sit with him a moment before you go',to:'__finish',fx:{flag:{friend_cathedral:1,trueEnd:1,hushEnd:1},xp:2},go:1,hide:null,tag:'Kind choice'},
   {t:'Take the bells and go',to:'__finish',fx:{flag:{hushEnd:1}},alt:1}]}
},
 finish:{xp:6,bells:10,bellp:'cathedral',mats:{gem:5,tinsel:5,bits:5},next:'eve',txt:'All twelve pieces are yours. The Engine is waiting at the North Pole. It is time to bring Christmas home.',act:3}});

/* ---------------- EPILOGUE: Christmas Eve Flight ---------------- */
chap({id:'eve',n:13,name:'Christmas Eve',icon:'🌟',theme:'finale',lv:20,act:4,hidden:true,start:'ev1',nodes:{
 ev1:{title:'The Engine Sings',theme:'workshop',text:G=>{
   const L=['Back at the North Pole, the whole workshop waits in the dark. You slot the twelve pieces into the Jingle Engine, one by one.',
   'There is a long breath of silence. Then a single, tiny bell rings. Then another. Then all of them, together.',
   'JINGLE-JANGLE-BOOM-SHAKALAKA! Golden light bursts from the Engine and floods the workshop. Every elf cheers so loud the snow falls off the roof.',
   'Santa|(his voice is back, a bit rusty) HO! HO! Ho ho HO! {name}, you have done what all of us could not.'];
   if(G.flags.trueEnd)L.push('At the back of the room, by the door, the Baron Von Hush stands with his scarf off. An elf hands him a mug of cocoa. He holds it like a treasure.');
   return L},
  choices:[{t:'Hop on the sleigh!',to:'ev2',go:1}]},
 ev2:{title:'All Aboard',theme:'finale',text:G=>{
   const c=G.party.have.filter(k=>k!=='nutmeg');
   const L=['The sleigh rises into the dark, silver runners shining, eight reindeer in goofy sweaters at the front.'];
   if(c.length)L.push('Your friends climb aboard: '+c.map(k=>D.COMP[k].i+' '+D.COMP[k].n).join(', ')+'. They all want to deliver presents.');
   L.push('Nutmeg|I am only a little scared. I have never flown before. Is there milk on this sleigh?');
   L.push('Santa|Only in the cocoa, my cookie friend. Hold on tight!');
   return L},
  choices:[{t:'Take the reins!',to:'ev_fly_intro',go:1}]},
 ev_fly_intro:{title:'The Christmas Eve Flight',theme:'finale',text:[
   'The whole world is dark and sparkling below. Chimneys glow. Windows flicker. Millions of children sleep in warm beds.',
   'Santa|One run, {name}! Dodge the storm clouds and gather the stars, and every present lands on time!'],
  mini:{type:'sleigh',title:'The Christmas Eve Flight',time:36,speed:1.35,final:true,outcomes:[
    {min:0,to:'ev_end',txt:'A bumpy flight, but every present gets there. The reindeer are proud of you.',fx:{xp:1,bells:5}},
    {min:1,to:'ev_end',txt:'A smooth ride. Santa lets you keep a few presents as a thank-you.',fx:{xp:2,bells:8,give:['cupcake']}},
    {min:2,to:'ev_end',txt:'A beautiful flight. The sleigh leaves a trail of golden sparks across the sky.',fx:{xp:3,bells:12,give:['cocoa'],mats:{gem:3}}},
    {min:3,to:'ev_end',txt:'PERFECT! You deliver every present in record time. The stars themselves ring a bell.',fx:{xp:4,bells:16,give:['cocoa','giftbox'],mats:{gem:5,tinsel:5}}}]}},
 ev_end:{title:'Merry Christmas',theme:'finale',text:G=>{
   const L=['Dawn creeps over the North Pole. The sleigh glides to a stop in the snow. Elves rush out with blankets and cocoa.',
   'Santa|Ho ho HO! Merry Christmas, {name}!'];
   if(G.flags.trueEnd)L.push('Baron Von Hush stands at the edge of the party, a little shy. Tink rings a bell. Everyone makes room. Someone gently pulls out a chair beside Grimble.','Nutmeg|Next year, we should build a Quiet Corner at the party. For anyone who needs a break from the noise.');
   else L.push('The Hush is gone and Christmas is saved. But somewhere out there, a quiet corner of the world still waits for someone to say, "Come in. We saved you a seat."');
   if(G.flags.friend_peak)L.push('Grimble arrives with a tray of ice cream sandwiches and a clean paper crown. The elves cheer so loud the snow falls off the roof.');
   L.push('Nutmeg|Merry Christmas, {name}. You are my favorite person. Do not tell the other cookies.');
   return L},
  choices:[{t:'See your Christmas Certificate',to:'__ending',go:1}]}
}});

})(JQ);

const PAL={gold:['#ffcf5a','#fff3b0','#ffb347','#fff'],confetti:['#e8443b','#2f9e63','#ffcf5a','#4fb3f0','#ff8fc8','#9b5de5'],ice:['#a9d6f5','#fff','#7fd0ff'],heart:['#ff8fc8','#ffb3d0','#e8443b'],green:['#7be0a8','#fff','#2f9e63'],purple:['#c58bff','#fff','#9b5de5']};
U.fx={burst:function(kind,x,y,n){
  const cv=$('fx');if(!cv)return;if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)n=Math.min(n||30,10);
  const w=window.innerWidth,h=window.innerHeight;cv.width=w;cv.height=h;
  x=x==null?w/2:x;y=y==null?h*.38:y;n=n||44;const pal=PAL[kind]||PAL.gold;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=120+Math.random()*320;FX.ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-140,l:1,d:.7+Math.random()*.8,c:pal[i%pal.length],r:2+Math.random()*4,sq:Math.random()<.5})}
  if(!FX.run){FX.run=true;let last=0;const ctx=cv.getContext('2d');const f=function(t){const dt=Math.min(.05,last?(t-last)/1000:.016);last=t;ctx.clearRect(0,0,cv.width,cv.height);
    FX.ps=FX.ps.filter(p=>p.l>0);FX.ps.forEach(p=>{p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt/p.d;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;if(p.sq)ctx.fillRect(p.x,p.y,p.r*1.6,p.r*1.6);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}});ctx.globalAlpha=1;
    if(FX.ps.length)requestAnimationFrame(f);else{FX.run=false;ctx.clearRect(0,0,cv.width,cv.height)}};requestAnimationFrame(f)}
},
at:function(el,kind,n){if(!el)return;const r=el.getBoundingClientRect();U.fx.burst(kind,r.left+r.width/2,r.top+r.height/2,n)}};

/* ---------- helpers ---------- */
const curCh=()=>U.G&&U.G.where&&CH[U.G.where.ch];
const curLv=()=>{const c=curCh();return c?c.lv:U.G.lvl};
U.curLv=curLv;
U.gearCard=function(g,o){
  o=o||{};const r=D.RAR[g.rar];
  const stats=D.SK.filter(k=>g.b[k]).map(k=>'<span class="st '+k+'">+'+g.b[k]+' '+D.STATS[k].n+'</span>').join('');
  return '<div class="gear '+r.k+(o.eq?' eq':'')+'"><div class="gi" aria-hidden="true">'+D.SLOTS[g.slot].i+'</div><div class="gb"><div class="gn">'+esc(g.name)+(g.plus?' <em>+'+g.plus+'</em>':'')+'</div><div class="gm">'+r.n+' '+D.SLOTS[g.slot].n+(o.eq?' · Equipped':'')+'</div><div class="gs">'+stats+'</div>'+(g.perk?'<div class="gp"><b>'+D.PERKS[g.perk].n+'</b> '+D.PERKS[g.perk].d+'</div>':'')+(g.d?'<div class="gd">'+esc(g.d)+'</div>':'')+'</div></div>';
};
U.chips=function(a){return a&&a.length?'<div class="chips">'+a.map(n=>'<span class="chip '+(n.k||'')+'">'+esc(n.t)+'</span>').join('')+'</div>':''};
U.lines=function(lines){
  return lines.map(function(l){
    const t=U.sub(l);const m=/^([A-Za-z.' -]{2,22})\|([\s\S]*)$/.exec(t);
    if(m)return '<div class="say"><div class="av" aria-hidden="true">'+(D.SPEAK[m[1]]||'💬')+'</div><div class="bub"><b>'+esc(m[1])+'</b><p>'+esc(m[2])+'</p></div></div>';
    return '<p class="narr">'+esc(t)+'</p>';
  }).join('');
};
U.meter=(cls,pct,label)=>'<div class="meter '+cls+'" role="img" aria-label="'+esc(label)+'"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i><span>'+esc(label)+'</span></div>';
U.odds=function(stat,dcKey){
  const G=U.G,dc=L.dc(curLv(),dcKey,G.ng),b=L.ckBonus(G,stat),need=dc-b,p=Math.max(.05,Math.min(1,(21-need)/20));
  return p>=.75?['Easy','easy']:p>=.45?['Fair','fair']:p>=.2?['Tricky','tricky']:['Hard','hard'];
};

/* apply effects + handle events */
U.apply=function(fx,lv,keep){
  const G=U.G;const r=L.applyFx(G,fx,{lv:lv||curLv()});
  S.notes=keep?S.notes.concat(r.notes):r.notes;
  U.events(r.ev);U.badges();U.save();return r;
};
U.events=function(ev){
  ev.forEach(function(e){
    if(e.k==='loot'){S.lootQ.push(e.gear)}
    else if(e.k==='lvl'){S.lvlUp.push(e);U.snd('level');U.fx.burst('gold')}
    else if(e.k==='ally'){U.toast(D.COMP[e.id].n+' joined your party!','gold');U.snd('win');U.fx.burst('heart')}
    else if(e.k==='piece'){U.snd('legend');U.fx.burst('confetti',null,null,70)}
    else if(e.k==='orn'){U.toast('Golden Ornament: '+e.orn.n,'gold');U.snd('epic');U.fx.burst('gold')}
    else if(e.k==='tree'){U.toast('Ornament Tree bonus unlocked! ('+e.n+' found)','gold')}
  });
};
U.badges=function(){const nb=L.checkBadges(U.G);nb.forEach(b=>U.toast('Badge: '+b.n+' (+25 bells)','gold'));if(nb.length)U.snd('rare')};

/* ---------- HUD & nav ---------- */
const NAVI={

  hero:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
  bag:'<path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  party:'<circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5M14 20c0-2 2-4 4-4s4 2 4 4"/>',
  tree:'<path d="M12 3 6 11h3l-4 6h14l-4-6h3z"/><path d="M12 17v4"/>'
};
function hudHTML(){
  const G=U.G;if(!G||S.screen==='title'||S.screen==='create')return '';
  const c=D.CLASSES[G.cls],mx=L.maxHp(G),msp=L.maxSp(G);
  const xp=G.lvl>=L.MAXLV?100:Math.round(G.xp/L.xpNeed(G.lvl)*100);
  return '<div class="hud-in"><div class="hrow"><span class="hav" aria-hidden="true">'+c.i+'</span><span class="hname">'+esc(G.name)+'</span><span class="lvl">Lv '+G.lvl+'</span>'+(G.ng?'<span class="ngtag">Blizzard '+G.ng+'</span>':'')+'<span class="grow"></span><span class="pill" title="Bells">🔔 '+G.bells+'</span><span class="pill" title="Gears and Silver Bells found">✦ '+L.pieceCount(G)+'/12</span><button class="ibtn" data-a="modal" data-m="settings" aria-label="Settings">☰</button></div>'+
    '<div class="hrow2">'+U.meter('cheer',G.hp/mx*100,'Cheer '+G.hp+' / '+mx)+'<div class="sstars" role="img" aria-label="'+G.sp+' of '+msp+' Sparkle Stars">'+'★'.repeat(G.sp)+'<u>'+'★'.repeat(Math.max(0,msp-G.sp))+'</u></div></div>'+

function navHTML(){
  const G=U.G;if(!G)return '';
  if(['map','story','check','finish'].indexOf(S.screen)<0)return '';
  const items=[['map','Map'],['hero','Hero'],['bag','Bag'],['party','Party'],['tree','Tree']];
  return '<div class="nav-in">'+items.map(function(it){
    const act=(it[0]==='map'&&S.screen==='map'&&!S.modal)||(S.modal&&S.modal.t===it[0]);
    const dot=(it[0]==='hero'&&G.pts>0)?'<i class="dot"></i>':'';
    return '<button class="nb'+(act?' on':'')+'" data-a="nav" data-n="'+it[0]+'"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+NAVI[it[0]]+'</svg><span>'+it[1]+'</span>'+dot+'</button>';
  }).join('')+'</div>';
}
function mood(){
  const G=U.G;if(!G)return 'cozy';
  switch(S.screen){
    case 'battle':return S.bt&&S.bt.B.e.boss?'boss':'battle';
    case 'mini':return 'quest';
    case 'ending':return 'finale';
    case 'story':case 'check':{const c=curCh(),n=c&&c.nodes[G.where.node];const th=(n&&n.theme)||(c&&c.theme);return (th==='hush'||th==='woods'||th==='cathedral')?'hush':th==='finale'?'finale':'cozy'}
    default:return 'cozy';
  }
}
function viewHTML(){
  switch(S.screen){
    case 'title':return U.titleView();
    case 'create':return U.createView();
    case 'map':return U.mapView();
    case 'story':return U.storyView();
    case 'check':return U.checkView();
    case 'battle':return U.battleView();
    case 'bend':return U.bendView();
    case 'retreat':return U.retreatView();
    case 'mini':return U.miniView();
    case 'finish':return U.finishView();
    case 'ending':return U.endingView();
  }
  return '';
}
U.render=function(top){
  const y=window.scrollY;
  $('hud').innerHTML=hudHTML();
  const locked=S.screen==='mini'&&S.mini&&S.mini.phase==='play'&&S.mini.started&&!!document.getElementById('mghost');
  if(!locked)$('view').innerHTML=viewHTML();
  $('nav').innerHTML=navHTML();
  $('layer').innerHTML=U.layerHTML?U.layerHTML():'';
  document.body.dataset.screen=S.screen;
  if(top)window.scrollTo(0,0);else if(!locked)window.scrollTo(0,y);
  try{J.S.setMood(mood())}catch(e){}
  if(U.afterRender)U.afterRender();
};
U.go=function(screen,top){S.screen=screen;S.modal=null;U.render(top!==false)};

U.H.newgame=function(b){

U.H.continue=function(){const g=U.load();if(!g)return;U.G=g;U.resume()};
U.H.totitle=function(){U.G=null;S.confirm=null;U.go('title')};
U.H.cls=function(b){

  document.querySelectorAll('.cls').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));

U.H.begin=function(){
  if(!S.cls)return;

U.resume=function(){
  const G=U.G;S.notes=[];
  if(G.where&&G.where.ch&&CH[G.where.ch]&&CH[G.where.ch].nodes[G.where.node])U.go('story');

/* ---------- map ---------- */
const ACTS={1:'Act I · The Scattered Gears',2:'Act II · Beyond the Pole',3:'Act III · The Great Hush',4:'Finale · Christmas Eve'};
const GEARS=['forest','factory','lake','kitchen','peak'],BELLS=['aurora','mines','village','wrap','woods','yard','cathedral'];
U.chapterIds=function(){const G=U.G;return CH._order.filter(id=>!CH[id].hidden||(id==='eve'&&G.ch.cathedral&&G.ch.cathedral.done))};
U.unlocked=function(id){
  const G=U.G,ids=CH._order,i=ids.indexOf(id);
  if(id==='eve')return !!(G.ch.cathedral&&G.ch.cathedral.done);
  if(i===0)return !!G.flags.prologue;
  return !!(G.ch[ids[i-1]]&&G.ch[ids[i-1]].done);
};
U.mapView=function(){
  const G=U.G,ids=U.chapterIds(),n=ids.length,H=80+n*118;
  const pts=ids.map((id,i)=>({id:id,x:200+105*Math.sin(i*1.3+.4),y:70+i*118}));
  let d='M'+pts[0].x.toFixed(1)+' '+pts[0].y;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],my=(a.y+b.y)/2;d+=' C'+a.x.toFixed(1)+' '+my+' '+b.x.toFixed(1)+' '+my+' '+b.x.toFixed(1)+' '+b.y}
  let nodes='',prevAct=0,firstOpen=true;
  pts.forEach(function(p,i){
    const c=CH[p.id],rec=G.ch[p.id],done=rec&&rec.done,open=U.unlocked(p.id);
    const state=done?'done':open?'open':'locked';
    const cur=open&&!done&&firstOpen;if(cur)firstOpen=false;
    const st=done?'<span class="ns">'+'★'.repeat(rec.stars||1)+'<u>'+'★'.repeat(3-(rec.stars||1))+'</u></span>':'';
    if(c.act!==prevAct){nodes+='<div class="actlab" style="top:'+((p.y-62)/H*100).toFixed(2)+'%">'+ACTS[c.act]+'</div>';prevAct=c.act}
    nodes+='<button class="node '+state+(cur?' cur':'')+'" style="left:'+(p.x/400*100).toFixed(2)+'%;top:'+(p.y/H*100).toFixed(2)+'%" data-a="chapter" data-id="'+p.id+'" aria-label="'+esc(c.name)+(open?'':' (locked)')+'"><span class="ni" aria-hidden="true">'+(open||done?c.icon:'🔒')+'</span></button>'+
      '<div class="nlab '+state+'" style="left:'+(p.x/400*100).toFixed(2)+'%;top:'+((p.y+40)/H*100).toFixed(2)+'%"><b>'+esc(c.name)+'</b><small>Lv '+c.lv+'</small>'+st+'</div>';
  });
  const pieces='<div class="pieces" aria-label="Quest pieces">'+GEARS.map(g=>'<span class="pc gear'+(G.pieces.gears[g]?' on':'')+'" title="Jingle Gear">✦</span>').join('')+'<span class="sep"></span>'+BELLS.map(b=>'<span class="pc bell'+(G.pieces.bells[b]?' on':'')+'" title="Silver Bell">🔔</span>').join('')+'</div>';
  const o=L.ornCount(G);
  return '<section class="mapv"><div class="card"><div class="body mapHead"><p class="eyebrow">Your quest</p><h2 class="st">The North Pole</h2>'+pieces+'<p class="mapsub">'+L.pieceCount(G)+' of 12 pieces found · '+o+' of 12 ornaments · '+J.starsTotal(G)+' chapter stars</p>'+(G.flags.prologue?'':'<button class="btn primary" data-a="goprologue">Continue the prologue</button>')+'</div></div>'+
    '<div class="mapwrap" style="aspect-ratio:400 / '+H+'"><svg class="mapsvg" viewBox="0 0 400 '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" class="trail"/><path d="'+d+'" class="trail2"/></svg>'+nodes+'</div>'+
    '<div class="hub"><button class="btn" data-a="camp">Rest at the Cocoa Stop</button><button class="btn" data-a="modal" data-m="shop">Jolly Jingle Shop</button>'+(G.flags.forge?'<button class="btn" data-a="modal" data-m="forge">Cookie Forge</button>':'')+'<button class="btn" data-a="modal" data-m="advent">Advent Calendar'+(G.adv.keys?' <b class="kc">'+G.adv.keys+'</b>':'')+'</button></div></section>';
};
U.H.goprologue=function(){U.enterChapter('prologue',U.G.where&&U.G.where.ch==='prologue'?U.G.where.node:'p1')};
U.H.camp=function(){
  const G=U.G;G.hp=L.maxHp(G);G.sp=L.maxSp(G);U.save();U.snd('heal');U.fx.burst('green',null,null,26);U.toast('Rested at the Cocoa Stop. Cheer and Sparkle Stars refilled.','good');U.render();
};
U.H.chapter=function(b){S.mapSel=b.dataset.id;S.modal={t:'chapter'};U.snd('tap');U.render()};
U.enterChapter=function(id,node){
  const G=U.G,c=CH[id];if(!c)return;
  G.where={ch:id,node:node||c.start};S.notes=[];U.save();S.modal=null;U.go('story');
};
U.goNode=function(id){
  const G=U.G;
  if(id==='__map'){G.where={ch:null,node:null};if(!G.flags.prologue)G.flags.prologue=1;U.save();S.notes=S.notes;U.go('map');return}
  if(id==='__finish'){U.finishChapter();return}
  if(id==='__ending'){U.ending();return}
  G.where.node=id;U.save();U.go('story');
};

/* ---------- story node ---------- */
U.storyView=function(){
  const G=U.G,w=G.where,ch=CH[w.ch];
  if(!ch||!ch.nodes[w.node]){S.screen='map';return U.mapView()}
  const node=ch.nodes[w.node],theme=node.theme||ch.theme;
  const lines=typeof node.text==='function'?node.text(G):node.text;
  let chs=[];
  if(node.choices)chs=(typeof node.choices==='function'?node.choices(G):node.choices).filter(c=>!(c.hide&&c.hide(G)));
  S.chs=chs;
  let h='<section class="card story"><div class="art'+(node.battle&&node.battle.boss?' bossart':'')+'">'+A.scene(theme,{boss:!!(node.battle&&node.battle.boss)})+'</div><div class="body">';
  if(ch.id!=='prologue'&&ch.n)h+='<p class="eyebrow">Chapter '+ch.n+' · '+esc(ch.name)+'</p>';
  h+=U.chips(S.notes)+'<h2 class="st">'+esc(U.sub(node.title))+'</h2>'+U.lines(lines);
  if(node.battle){
    const e=E[node.battle.enemy];
    h+='<div class="foeprev'+(e.boss?' boss':'')+'"><div class="fi" aria-hidden="true">'+e.i+'</div><div><b>'+esc(e.n)+'</b> <span class="lvtag">Lv '+e.lv+'</span>'+(e.boss?'<span class="bosstag">BOSS</span>':'')+'<small>'+esc(e.tip||'')+'</small>'+(e.weak?'<small class="wk">Weak to '+D.STATS[e.weak].n+'</small>':'')+'</div></div><div class="choices"><button class="ch go" data-a="fight">Fight!</button></div>';
  }else if(node.mini){
    const m=node.mini;
    h+='<div class="choices"><button class="ch go" data-a="play"><span>Play: '+esc(m.title)+'</span><span class="tag mini">Mini-game</span></button></div>';
  }else{
    h+='<div class="choices">'+chs.map(function(c,i){
      let tag='';
      if(c.check){const o=U.odds(c.check.stat,c.check.dc);tag='<span class="tag '+c.check.stat+'">'+D.STATS[c.check.stat].n+' · '+o[0]+'</span>'}
      else if(c.tag)tag='<span class="tag opt">'+esc(c.tag)+'</span>';
      return '<button class="ch'+(c.go?' go':'')+(c.alt?' alt':'')+'" data-a="choose" data-i="'+i+'"><span>'+esc(U.sub(c.t))+'</span>'+tag+'</button>';
    }).join('')+'</div>';
  }
  return h+'</div></section>';
};
U.H.choose=function(b){
  const c=S.chs[+b.dataset.i];if(!c)return;U.snd('tap');
  if(c.check){U.startCheck(c);return}
  let lv=curLv();
  if(c.fx)U.apply(c.fx,lv);else S.notes=[];
  U.goNode(c.to);
};

/* ---------- skill checks ---------- */
U.startCheck=function(c){
  const G=U.G;
  S.chk={c:c,ck:c.check,dc:L.dc(curLv(),c.check.dc,G.ng),boost:false,paid:false,res:null,rolling:false};
  U.go('check');
};
U.checkView=function(){
  const G=U.G,k=S.chk;if(!k){S.screen='story';return U.storyView()}
  const ck=k.ck,st=D.STATS[ck.stat],b=L.ckBonus(G,ck.stat),ch=curCh(),node=ch&&ch.nodes[G.where.node];
  const theme=(node&&node.theme)||(ch&&ch.theme)||'map';
  let h='<section class="card story"><div class="art">'+A.scene(theme)+'</div><div class="body"><span class="tag '+ck.stat+'">'+st.n+' check</span><h2 class="st">'+esc(ck.title)+'</h2>';

const D=J.D,L=J.L,R=J.R,CH=J.CH,E=J.E,U=J.U,A=J.A,S=U.S,esc=U.esc;
const $=id=>document.getElementById(id);
const price=k=>Math.round(D.ITEMS[k].price*(1+U.G.lvl*.08));
function sheet(title,body,wide){
  return '<div class="ov"><div class="bd" data-a="close"></div><div class="sheet'+(wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sh-h"><h2>'+esc(title)+'</h2><button class="ibtn" data-a="close" aria-label="Close">✕</button></div><div class="sh-b">'+body+'</div></div></div>';
}
function statRow(G,s){
  const st=D.STATS[s],base=G.base[s],tot=L.stat(G,s);
  return '<div class="srow"><span class="sn '+s+'"><b>'+st.n+'</b><small>'+esc(st.d||'')+'</small></span><span class="sv">'+tot+(tot!==base?'<small> ('+base+' base)</small>':'')+'</span>'+(G.pts>0?'<button class="plus" data-a="spend" data-s="'+s+'" aria-label="Add a point to '+st.n+'">+</button>':'')+'</div>';
}
/* ---------- modals ---------- */
const M={};
M.hero=function(G){
  const c=D.CLASSES[G.cls],mx=L.maxHp(G),msp=L.maxSp(G);
  let h='<div class="hero"><div class="hbig" aria-hidden="true">'+c.i+'</div><div><b class="hn">'+esc(G.name)+'</b><div class="hc">'+c.n+' · Level '+G.lvl+(G.ng?' · Blizzard '+G.ng:'')+'</div>'+U.meter('xp',G.lvl>=L.MAXLV?100:G.xp/L.xpNeed(G.lvl)*100,G.lvl>=L.MAXLV?'Max level!':'XP '+G.xp+' / '+L.xpNeed(G.lvl))+'</div></div>';
  if(G.pts>0)h+='<p class="note gold">You have '+G.pts+' stat point'+(G.pts>1?'s':'')+' to spend!</p>';
  h+='<div class="stats">'+D.SK.map(s=>statRow(G,s)).join('')+'</div>';
  h+='<div class="derived"><span>❤ Cheer '+mx+'</span><span>★ Sparkle Stars '+msp+'</span><span>🛡 Armor '+L.armor(G)+'</span><span>💨 Dodge '+Math.round(L.dodgeChance(G)*100)+'%</span></div>';
  h+='<h3>Equipped</h3><div class="glist">'+D.SLOT_KEYS.map(function(s){
    const g=G.gear.find(x=>x.id===G.eq[s]);
    return g?U.gearCard(g,{eq:1}):'<div class="gear empty"><div class="gi" aria-hidden="true">'+D.SLOTS[s].i+'</div><div class="gb"><div class="gn">Empty '+D.SLOTS[s].n+' slot</div><div class="gm">Find loot in battles and chests.</div></div></div>';
  }).join('')+'</div>';
  h+='<h3>'+c.n+' moves</h3><div class="ablist">'+c.ab.map(a=>'<div class="abi'+(a.unlock>G.lvl?' lock':'')+'"><b>'+esc(a.n)+'</b><span class="cost">'+(a.unlock>G.lvl?'Lv '+a.unlock:'★'.repeat(a.cost))+'</span><small>'+esc(a.d)+'</small></div>').join('')+'</div>';
  return sheet('Hero',h);
};
M.bag=function(G){
  const tabs=[['gear','Gear'],['items','Goodies'],['mats','Materials']];
  let h='<div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" class="tab'+(S.tab===t[0]?' on':'')+'" aria-selected="'+(S.tab===t[0])+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(S.tab==='gear'){
    const list=G.gear.slice().sort((a,b)=>D.SLOT_KEYS.indexOf(a.slot)-D.SLOT_KEYS.indexOf(b.slot)||b.rar-a.rar||L.gearScore(b)-L.gearScore(a));
    if(!list.length)h+='<p class="note">No gear yet. Win battles and open chests.</p>';
    h+='<div class="glist">'+list.map(function(g){
      const eq=G.eq[g.slot]===g.id;
      return '<div class="gwrap">'+U.gearCard(g,{eq:eq})+'<div class="gact">'+(eq?'':'<button class="btn sm" data-a="equip" data-id="'+g.id+'">Equip</button><button class="btn sm ghost" data-a="sell" data-id="'+g.id+'">Sell · '+L.sellValue(g)+' 🔔</button>')+'</div></div>';
    }).join('')+'</div>';
  }else if(S.tab==='items'){
    const ks=D.ITEM_KEYS.filter(k=>G.inv[k]>0);
    if(!ks.length)h+='<p class="note">No goodies. Visit the Jolly Jingle Shop or open Advent doors.</p>';
    h+='<div class="ilist">'+ks.map(function(k){
      const it=D.ITEMS[k],usable=!it.battle&&!it.reroll;
      return '<div class="item"><span class="ii" aria-hidden="true">'+it.i+'</span><span class="ib"><b>'+it.n+' ×'+G.inv[k]+'</b><small>'+it.d+'</small></span>'+(usable?'<button class="btn sm" data-a="useitem" data-k="'+k+'">Use</button>':'<span class="tag opt">'+(it.reroll?'Skill checks':'Battles')+'</span>')+'</div>';
    }).join('')+'</div>';
  }else{
    h+='<div class="mats">'+D.MAT_KEYS.map(k=>'<div class="mat"><span aria-hidden="true">'+D.MATS[k].i+'</span><b>'+(G.mats[k]||0)+'</b><small>'+D.MATS[k].n+'</small></div>').join('')+'</div><p class="note">Materials craft goodies and upgrade gear at the Cookie Forge (unlocked in the Cookie Kitchen).</p>';
  }
  return sheet('Bag · 🔔 '+G.bells,h);
};
M.party=function(G){
  const act=G.party.act;
  let h='<p class="note">Nutmeg always comes along. Pick up to 2 more companions. Each adds a bonus and a once-per-battle assist.</p><div class="plist">';
  D.COMP_KEYS.forEach(function(k){
    const c=D.COMP[k],have=G.party.have.indexOf(k)>=0,on=k==='nutmeg'||act.indexOf(k)>=0;
    h+='<div class="comp'+(have?'':' lock')+(on?' on':'')+'"><span class="ci" aria-hidden="true">'+(have?c.i:'❔')+'</span><span class="cb"><b>'+(have?c.n:'???')+'</b>'+(have?'<small>'+c.role+'</small><small class="pas">'+c.pas+'</small>'+(c.as?'<small class="as">Assist: '+c.as.n+' — '+c.as.d+'</small>':'')+'<small class="intro">'+esc(c.intro)+'</small>':'<small>Befriend them in the story to unlock.</small>')+'</span>'+(have&&k!=='nutmeg'?'<button class="btn sm'+(on?' primary':'')+'" data-a="pact" data-k="'+k+'" aria-pressed="'+on+'">'+(on?'In party':'Add')+'</button>':'')+'</div>';
  });
  return sheet('Party',h+'</div>');
};
M.tree=function(G){
  const n=L.ornCount(G);
  let h='<div class="tree'+(n>=12?' gold':'')+'" aria-label="'+n+' of 12 ornaments">'+D.ORN.map(o=>'<span class="orn'+(G.ornaments[o.id]?' on':'')+'" title="'+esc(o.n)+'">'+(G.ornaments[o.id]?o.i:'·')+'</span>').join('')+'</div>';
  h+='<div class="tiers">'+D.ORN_TIERS.map(t=>'<div class="tier'+(n>=t.n?' on':'')+'"><b>'+t.n+' ornaments</b><span>'+t.d+'</span></div>').join('')+'</div>';
  h+='<h3>Ornaments</h3><div class="olist">'+D.ORN.map(function(o){const f=!!G.ornaments[o.id];return '<div class="oi'+(f?' on':'')+'"><span aria-hidden="true">'+(f?o.i:'❔')+'</span><b>'+(f?o.n:'Hidden')+'</b><small>'+(f?CH[o.ch].name:'Hidden in '+CH[o.ch].name)+'</small></div>'}).join('')+'</div>';
  const nb=Object.keys(G.badges).length;
  h+='<h3>Badges · '+nb+' / '+D.BADGES.length+'</h3><div class="blist">'+D.BADGES.map(b=>'<div class="bdg'+(G.badges[b.id]?' on':'')+'"><b>'+esc(b.n)+'</b><small>'+esc(b.d)+'</small></div>').join('')+'</div>';
  return sheet('Ornament Tree',h,true);
};
M.shop=function(G){
  let h='<p class="note">You have 🔔 '+G.bells+'. Sell extra gear from your Bag for more bells.</p><div class="ilist">'+D.SHOP.map(function(k){
    const it=D.ITEMS[k],p=price(k);
    return '<div class="item"><span class="ii" aria-hidden="true">'+it.i+'</span><span class="ib"><b>'+it.n+(G.inv[k]?' <em>(own '+G.inv[k]+')</em>':'')+'</b><small>'+it.d+'</small></span><button class="btn sm" data-a="buy" data-k="'+k+'"'+(G.bells<p?' disabled':'')+'>'+p+' 🔔</button></div>';
  }).join('')+'</div>';
  return sheet('Jolly Jingle Shop',h);
};
M.forge=function(G){
  const cost=c=>[c.bells?c.bells+' 🔔':''].concat(D.MAT_KEYS.filter(k=>c[k]).map(k=>c[k]+' '+D.MATS[k].i)).filter(Boolean).join(' · ');
  let h='<h3>Bake goodies</h3><div class="ilist">'+D.RECIPES.map(function(r){
    const it=D.ITEMS[r.item];
    return '<div class="item"><span class="ii" aria-hidden="true">'+it.i+'</span><span class="ib"><b>'+it.n+'</b><small>'+cost(r.cost)+'</small></span><button class="btn sm" data-a="craft" data-id="'+r.id+'"'+(L.canPay(G,r.cost)?'':' disabled')+'>Make</button></div>';
  }).join('')+'</div><h3>Upgrade gear</h3>';
  const gl=G.gear.slice().sort((a,b)=>(G.eq[b.slot]===b.id)-(G.eq[a.slot]===a.id)||b.rar-a.rar);
  if(!gl.length)h+='<p class="note">No gear to upgrade yet.</p>';
  h+='<div class="glist">'+gl.map(function(g){
    const max=g.plus>=5,c=L.upCost(g);
    return '<div class="gwrap">'+U.gearCard(g,{eq:G.eq[g.slot]===g.id})+'<div class="gact">'+(max?'<span class="tag opt">Maxed +5</span>':'<span class="ucost">'+cost(c)+'</span><button class="btn sm" data-a="upg" data-id="'+g.id+'"'+(L.canPay(G,c)?'':' disabled')+'>Upgrade</button>')+'</div></div>';
  }).join('')+'</div>';
  return sheet('Cookie Forge · 🔔 '+G.bells,h,true);
};
M.advent=function(G){
  let h='<p class="note">Keys: <b>'+G.adv.keys+'</b>. You earn a key every even level and every chapter you finish.</p>';
  if(S.advNotes&&S.advNotes.length)h+='<div class="advwin"><b>Door '+S.advN+' opened!</b>'+U.chips(S.advNotes)+'</div>';
  h+='<div class="advgrid">';
  for(let n=1;n<=24;n++){
    const open=!!G.adv.open[n];
    h+='<button class="door'+(open?' open':'')+(S.advN===n?' just':'')+'" data-a="door" data-n="'+n+'"'+(open||G.adv.keys<1?' disabled':'')+' aria-label="Door '+n+(open?' (opened)':'')+'"><span>'+(open?'✔':n)+'</span></button>';
  }
  return sheet('Advent Calendar',h+'</div>');
};
M.settings=function(G){
  const s=J.S;
  let h='<div class="srows"><button class="toggle" data-a="tmusic" aria-pressed="'+s.musicOn+'">Music: '+(s.musicOn?'On':'Off')+'</button><button class="toggle" data-a="tsfx" aria-pressed="'+s.sfxOn+'">Sound effects: '+(s.sfxOn?'On':'Off')+'</button></div>';
  if(G&&S.screen!=='title')h+='<div class="stack"><button class="btn" data-a="close">Back to the game</button><button class="btn ghost" data-a="totitle">Save and go to title</button></div>';
  h+='<p class="note">Your game saves automatically in this browser.</p>';
  return sheet('Settings',h);
};
M.help=function(){
  const h='<ul class="helpl"><li><b>Story.</b> Read, then pick what to do. Some choices are skill checks: roll a d20, add your stat, beat the number.</li><li><b>Stats.</b> Might, Sparkle, Sneak and Kindness. Spend a point each level in Hero.</li><li><b>Battles.</b> Each foe shows its next move. Guard before BIG hits. Hit its weakness for double damage.</li><li><b>Two ways to win.</b> Empty its Grump bar, or fill its Friendship hearts with Cheer Up! and gifts. Some foes need weakening first.</li><li><b>Jolly Meter.</b> Fills as you play. At 100%, Merry Burst!</li><li><b>Loot.</b> Gear has rarities: Common, Rare, Epic, Legendary. Upgrade it at the Cookie Forge.</li><li><b>Collect.</b> 12 Jingle Gears and Silver Bells, 12 Golden Ornaments, 7 companions, 24 Advent doors, 24 badges.</li><li><b>Stuck?</b> Rest at the Cocoa Stop on the map. It is free. You can also replay a chapter boss for loot.</li></ul>';
  return sheet('How to play',h);
};
M.chapter=function(G){
  const c=CH[S.mapSel];if(!c)return '';
  const rec=G.ch[c.id],open=U.unlocked(c.id),cont=G.where&&G.where.ch===c.id&&G.where.node!==c.start;
  let h='<div class="chead"><span class="cic" aria-hidden="true">'+c.icon+'</span><div><b>'+esc(c.name)+'</b><small>Chapter '+c.n+' · Level '+c.lv+'</small></div></div><p class="narr">'+esc(c.blurb)+'</p>';
  if(rec&&rec.done)h+='<p class="note">Stars: '+'★'.repeat(rec.stars||1)+'☆'.repeat(3-(rec.stars||1))+'</p>';
  if(!open)h+='<p class="note">Finish the chapter before this one to unlock it.</p>';
  else{
    h+='<div class="stack"><button class="btn primary big" data-a="enter" data-id="'+c.id+'">'+(cont?'Continue':rec&&rec.done?'Replay chapter':'Begin')+'</button>';
    if(cont)h+='<button class="btn" data-a="enter" data-id="'+c.id+'" data-restart="1">Restart this chapter</button>';
    if(rec&&rec.done&&c.rematch&&E[c.rematch])h+='<button class="btn" data-a="rematch" data-id="'+c.id+'">Rematch: '+esc(E[c.rematch].n)+' <small>(loot and half XP)</small></button>';
    h+='</div>';
  }
  return sheet('Chapter',h);
};
M.bitems=function(G){
  const bt=S.bt,B=bt&&bt.B;
  const ks=D.ITEM_KEYS.filter(k=>G.inv[k]>0&&!D.ITEMS[k].reroll);
  let h=ks.length?'<div class="ilist">'+ks.map(function(k){
    const it=D.ITEMS[k],bad=it.gift&&B&&!L.frActive(B);
    return '<div class="item"><span class="ii" aria-hidden="true">'+it.i+'</span><span class="ib"><b>'+it.n+' ×'+G.inv[k]+'</b><small>'+it.d+'</small></span><button class="btn sm" data-a="useb" data-k="'+k+'"'+(bad?' disabled':'')+'>Use</button></div>';
  }).join('')+'</div>':'<p class="note">No goodies left. Craft or buy more.</p>';
  return sheet('Goodies',h);
};

/* ---------- overlays: level up, loot ---------- */
function lvlOverlay(G){
  const e=S.lvlUp[0];
  return '<div class="ov top"><div class="bd"></div><div class="pop lvlpop" role="dialog" aria-modal="true" aria-label="Level up"><div class="burstring" aria-hidden="true"></div><p class="eyebrow">Level up!</p><div class="biglv">'+e.lvl+'</div><p class="narr">Cheer and Sparkle Stars are full. +1 stat point'+(e.lvl%2===0?' and +1 Advent key':'')+'.</p>'+(e.unl&&e.unl.length?e.unl.map(a=>'<div class="unl"><b>New move: '+esc(a.n)+'</b><small>'+esc(a.d)+'</small></div>').join(''):'')+'<div class="stack"><button class="btn primary big" data-a="lvlok">'+(G.pts>0?'Awesome!':'Keep going')+'</button>'+(G.pts>0?'<button class="btn" data-a="lvlhero">Spend points now</button>':'')+'</div></div></div>';
}
function lootOverlay(G){
  const g=S.lootQ[0],cur=G.gear.find(x=>x.id===G.eq[g.slot]),eq=G.eq[g.slot]===g.id;
  const better=cur&&cur.id!==g.id?L.gearScore(g)>L.gearScore(cur):false;
  return '<div class="ov top"><div class="bd"></div><div class="pop lootpop '+D.RAR[g.rar].k+'" role="dialog" aria-modal="true" aria-label="New loot"><div class="burstring" aria-hidden="true"></div><p class="eyebrow">'+(g.rar>=3?'LEGENDARY!':g.rar===2?'Epic find!':g.rar===1?'Rare find':'New gear')+'</p>'+U.gearCard(g,{eq:eq})+(cur&&!eq?'<p class="note">Wearing: '+esc(cur.name)+(better?'. <b class="up">This looks better!</b>':'')+'</p>':'')+'<div class="stack">'+(eq?'':'<button class="btn primary" data-a="lootequip">Equip it</button>')+'<button class="btn'+(eq?' primary':'')+'" data-a="lootok">'+(eq?'Nice!':'Keep in bag')+'</button></div>'+(S.lootQ.length>1?'<small class="more">'+(S.lootQ.length-1)+' more…</small>':'')+'</div></div>';
}
U.layerHTML=function(){
  const G=U.G;if(!G)return S.modal&&S.modal.t==='settings'?M.settings(null):S.modal&&S.modal.t==='help'?M.help():'';
  if(S.lvlUp.length&&['battle','mini'].indexOf(S.screen)<0&&!S.lock)return lvlOverlay(G);
  if(S.lootQ.length&&['battle','mini'].indexOf(S.screen)<0&&!S.lock)return lootOverlay(G);
  if(S.modal&&M[S.modal.t])return M[S.modal.t](G);
  return '';
};
const prevAfter=U.afterRender;
U.afterRender=function(){
  if(prevAfter)prevAfter();
  const g=S.lootQ[0];
  if(g&&document.querySelector('.lootpop')&&S.lootShown!==g.id){
    S.lootShown=g.id;U.snd(['rare','rare','epic','legend'][g.rar]||'chest');
    if(g.rar>=2)U.fx.burst(g.rar>=3?'gold':'purple',null,null,g.rar>=3?80:44);
  }
  const sh=document.querySelector('.sheet .sh-b,.pop');
  if(sh&&S.focusOv!==sh){try{const b=document.querySelector('.sheet .ibtn,.pop .btn');if(b&&!document.activeElement.closest('.ov'))b.focus({preventScroll:true})}catch(e){}}
};

/* ---------- handlers ---------- */
U.H.nav=function(b){
  const n=b.dataset.n;U.snd('tap');
  if(n==='map'){S.modal=null;if(S.screen!=='map'){U.go('map')}else U.render();return}
  S.modal=(S.modal&&S.modal.t===n)?null:{t:n};U.render();
};
U.H.modal=function(b){S.modal={t:b.dataset.m};U.snd('tap');U.render()};
U.H.close=function(){S.modal=null;S.advN=null;S.advNotes=null;U.render()};
U.H.tab=function(b){S.tab=b.dataset.t;U.render()};
U.H.spend=function(b){
  const G=U.G,s=b.dataset.s;if(G.pts<1)return;
  G.base[s]++;G.pts--;G.hp=Math.min(G.hp+0,L.maxHp(G));U.snd('good');U.save();U.render();
};
U.H.equip=function(b){L.equip(U.G,+b.dataset.id);U.snd('step');U.save();U.render()};
U.H.sell=function(b){
  const G=U.G,v=L.sell(G,+b.dataset.id);if(v){U.snd('buy');U.toast('Sold for '+v+' bells','good');U.badges();U.save();U.render()}
};
U.H.useitem=function(b){
  const G=U.G,k=b.dataset.k;
  if(L.useItemOutside(G,k)){U.snd('heal');U.fx.burst('green',null,null,20);U.toast(D.ITEMS[k].n+' used.','good');U.save();U.render()}
  else U.toast('You are already full!','info');
};
U.H.pact=function(b){
  const G=U.G,k=b.dataset.k,a=G.party.act,i=a.indexOf(k);
  if(i>=0)a.splice(i,1);
  else{if(a.length>=2)a.shift();a.push(k)}
  U.snd('tap');U.save();U.render();
};
U.H.buy=function(b){
  const G=U.G,k=b.dataset.k,p=price(k);if(G.bells<p)return;
  G.bells-=p;G.inv[k]=(G.inv[k]||0)+1;U.snd('buy');U.save();U.render();
};
U.H.craft=function(b){if(L.craft(U.G,b.dataset.id)){U.snd('buy');U.badges();U.save();U.render()}};
U.H.upg=function(b){
  const G=U.G;if(L.upgrade(G,+b.dataset.id)){U.snd('rare');U.fx.burst('gold',null,null,30);U.badges();U.save();U.render()}
};
U.H.door=function(b){
  const G=U.G,n=+b.dataset.n,r=L.openDoor(G,n);if(!r)return;
  S.advN=n;S.advNotes=r.notes.slice();U.snd('door');U.fx.burst('gold',null,null,30);
  U.events(r.ev);U.badges();U.save();U.render();
};
U.H.tmusic=function(){J.S.setMusicOn(!J.S.musicOn);U.render()};
U.H.tsfx=function(){J.S.setSfxOn(!J.S.sfxOn);U.snd('good');U.render()};
U.H.enter=function(b){
  const G=U.G,id=b.dataset.id,c=CH[id];if(!c||!U.unlocked(id))return;
  const cont=G.where&&G.where.ch===id&&G.where.node!==c.start&&!b.dataset.restart;
  U.enterChapter(id,cont?G.where.node:c.start);
};
U.H.rematch=function(b){U.rematch(b.dataset.id)};
U.H.lvlok=function(){S.lvlUp.shift();U.snd('tap');U.render()};
U.H.lvlhero=function(){S.lvlUp.length=0;S.modal={t:'hero'};U.render()};
U.H.lootok=function(){S.lootQ.shift();U.snd('tap');U.render()};
U.H.lootequip=function(){
  const g=S.lootQ.shift();if(g)L.equip(U.G,g.id);U.snd('step');U.save();U.render();
};
})(JQ);

/* ===== boot ===== */
(function(J){
'use strict';
const U=J.U;
try{J.S.load()}catch(e){}
/* falling snow */
(function(){
  const cv=document.getElementById('snow');if(!cv)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const ctx=cv.getContext('2d');let W=0,H=0,fl=[];
  function fit(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;fl=[];for(let i=0;i<Math.round(W*H/16000);i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,v:14+Math.random()*30,p:Math.random()*6.28})}
  fit();window.addEventListener('resize',fit);
  let last=0;
  function step(t){
    const dt=Math.min(.05,last?(t-last)/1000:.016);last=t;
    if(!document.hidden){
      ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.75)';
      fl.forEach(function(f){f.y+=f.v*dt;f.p+=dt;f.x+=Math.sin(f.p)*12*dt;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()});
